<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#E8ECEE">
<title>家族ローゼット（かぞクロ）</title>
<meta name="apple-mobile-web-app-title" content="かぞクロ">
<style>
:root{
  --bg:#E8ECEE; --surface:#FFFFFF; --surface2:#F3F6F7;
  --ink:#16323B; --ink2:#5C7480; --ink3:#8CA0A8;
  --line:#D5DDE0; --line2:#E6ECEE;
  --indigo:#24557A; --indigo-d:#1A4160; --indigo-bg:#E4EDF4;
  --amber:#A96E12; --amber-bg:#FAF0DC;
  --ok:#35705A; --ok-bg:#E4F0EA;
  --danger:#9B3B33;
  --r:14px; --r-s:9px;
  --safe-t:env(safe-area-inset-top,0px);
  --safe-b:env(safe-area-inset-bottom,0px);
  --nav-h:66px;
  box-sizing:border-box;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#101A1E; --surface:#182529; --surface2:#1F2E33;
    --ink:#E4EDEF; --ink2:#9AB0B8; --ink3:#6E858D;
    --line:#2A3B41; --line2:#223237;
    --indigo:#7FB0D6; --indigo-d:#A3C8E5; --indigo-bg:#1C3243;
    --amber:#D9A74E; --amber-bg:#33291A;
    --ok:#6FB294; --ok-bg:#1B2F28;
    --danger:#D97A70;
  }
}
*,*::before,*::after{box-sizing:inherit}
html{-webkit-text-size-adjust:100%}
html,body{margin:0;height:100%;overflow-x:hidden}
body{
  background:var(--bg); color:var(--ink);
  /* iPhoneのふつうのアプリと同じ文字（システムフォント）。字間は空けない */
  font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Hiragino Kaku Gothic ProN","Noto Sans JP","Yu Gothic UI","Meiryo",system-ui,sans-serif;
  font-size:calc(15px*var(--fs,1)); line-height:1.6;
  padding-top:var(--safe-t);
  -webkit-font-smoothing:antialiased;
  touch-action:manipulation;
}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:none;background:none;padding:0}
:focus-visible{outline:2px solid var(--indigo);outline-offset:2px}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

/* ---------- shell ---------- */
#app{max-width:620px;margin:0 auto;padding:0 16px calc(var(--nav-h) + var(--safe-b) + 28px)}
.view{display:none}
.view.on{display:block}

header.top{display:flex;align-items:baseline;justify-content:space-between;gap:12px;padding:20px 0 14px}
header.top h1{margin:0;font-size:calc(20px*var(--fs,1));font-weight:700}
header.top .sub{font-size:calc(12.5px*var(--fs,1));color:var(--ink2);font-variant-numeric:tabular-nums}

/* ---------- bottom nav ---------- */
nav.tabs{
  position:fixed;left:0;right:0;bottom:0;z-index:40;
  display:flex;background:var(--surface);
  border-top:1px solid var(--line);
  padding-bottom:var(--safe-b);
}
nav.tabs button{
  flex:1;height:var(--nav-h);display:flex;flex-direction:column;
  align-items:center;justify-content:center;gap:4px;
  color:var(--ink3);font-size:calc(11px*var(--fs,1));font-weight:600;
}
nav.tabs button svg{width:25px;height:25px;stroke:currentColor;fill:none;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
nav.tabs button[aria-current="page"]{color:var(--indigo)}
nav.tabs button .dot{position:absolute;margin-top:-30px;margin-left:18px;min-width:16px;height:16px;border-radius:8px;background:var(--amber);color:#fff;font-size:calc(10px*var(--fs,1));line-height:16px;font-weight:700;padding:0 4px}
@media (prefers-color-scheme:dark){nav.tabs button .dot{color:#241C0B}}

/* ---------- cards & bits ---------- */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px}
.card + .card{margin-top:12px}
.muted{color:var(--ink2)}
.tiny{font-size:calc(12.5px*var(--fs,1))}
.num{font-variant-numeric:tabular-nums}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;
  padding:14px 20px;min-height:52px;border-radius:12px;font-size:calc(16px*var(--fs,1));font-weight:700;
  background:var(--indigo);color:#fff;transition:opacity .12s}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .btn{color:#0E1A20}}
.btn:active{opacity:.75}
.btn.ghost{background:transparent;color:var(--indigo);border:1px solid var(--line)}
.btn.sub{background:var(--surface2);color:var(--ink);border:1px solid var(--line)}
.btn.wide{width:100%}
.btn.sm{padding:10px 15px;min-height:44px;font-size:calc(14.5px*var(--fs,1));border-radius:10px}
.btn[disabled]{opacity:.4;pointer-events:none}

label.f{display:block;margin:18px 0 7px;font-size:calc(13.5px*var(--fs,1));font-weight:700;color:var(--ink2)}
input[type=text],input[type=number],input[type=date],select,textarea{
  display:block;
  width:100%;max-width:100%;min-width:0;
  padding:14px 14px;border:1px solid var(--line);border-radius:11px;
  background:var(--surface2);font-size:max(16px,calc(16px*var(--fs,1)));
  -webkit-appearance:none;appearance:none}
input[type=date]{min-height:44px;line-height:1.4}
input[type=number]::-webkit-inner-spin-button,
input[type=number]::-webkit-outer-spin-button{-webkit-appearance:none;margin:0}
textarea{resize:vertical;line-height:1.7}

.chips{display:flex;flex-wrap:wrap;gap:9px}
.chip{display:inline-flex;align-items:center;min-height:48px;
  padding:0 18px;border-radius:999px;border:1px solid var(--line);
  background:var(--surface2);font-size:calc(15px*var(--fs,1));font-weight:600;color:var(--ink2)}
.chip[aria-pressed="true"]{background:var(--indigo);border-color:var(--indigo);color:#fff}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .chip[aria-pressed="true"]{color:#0E1A20}}
.chip .sw{display:inline-block;width:15px;height:15px;border-radius:4px;margin-right:8px;
  border:1px solid rgba(0,0,0,.18);flex:0 0 auto}

.catgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.catgrid button{padding:16px 6px;min-height:92px;border-radius:14px;border:1px solid var(--line);
  background:var(--surface2);font-size:calc(13.5px*var(--fs,1));font-weight:700;color:var(--ink2);text-align:center;line-height:1.35}
.catgrid button .g{display:block;font-size:calc(30px*var(--fs,1));margin-bottom:5px}
.catgrid button[aria-pressed="true"]{background:var(--indigo-bg);border-color:var(--indigo);
  color:var(--indigo-d);box-shadow:inset 0 0 0 1px var(--indigo)}

/* ---------- closet grid ---------- */
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:14px}
@media(min-width:480px){.grid{grid-template-columns:repeat(4,1fr)}}
.tile{position:relative;aspect-ratio:1;border-radius:var(--r-s);overflow:hidden;
  background:var(--surface2);border:1px solid var(--line);display:block}
.tile img{width:100%;height:100%;object-fit:cover;display:block;transition:filter .3s}
.tile .ph{width:100%;height:100%;display:flex;align-items:center;justify-content:center;font-size:calc(26px*var(--fs,1));opacity:.35}
.tile .tag{position:absolute;left:6px;bottom:6px;padding:4px 8px;border-radius:7px;
  background:rgba(10,22,27,.78);color:#fff;font-size:calc(11.5px*var(--fs,1));font-weight:700}
.tile .flag{position:absolute;right:5px;top:5px;width:9px;height:9px;border-radius:5px;box-shadow:0 0 0 2px var(--surface)}
.tile .flag.amber{background:var(--amber)}
.tile .flag.ok{background:var(--ok)}

.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:calc(11.5px*var(--fs,1));color:var(--ink3);margin-top:10px;align-items:center}
.legend i{display:inline-block;width:8px;height:8px;border-radius:4px;margin-right:5px;vertical-align:0}

.filters{display:flex;gap:7px;overflow-x:auto;padding:2px 0 8px;-webkit-overflow-scrolling:touch}
.filters::-webkit-scrollbar{display:none}
.filters .chip{flex:0 0 auto}

.empty{text-align:center;padding:44px 20px;color:var(--ink2)}
.empty .g{font-size:calc(38px*var(--fs,1));display:block;margin-bottom:10px;opacity:.55}
.empty p{margin:0 0 16px;font-size:calc(14px*var(--fs,1))}

/* ---------- stats ---------- */
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:1px;background:var(--line2);
  border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.stats div{background:var(--surface);padding:14px 8px;text-align:center}
.stats b{display:block;font-size:calc(21px*var(--fs,1));font-weight:700;font-variant-numeric:tabular-nums}
.stats span{font-size:calc(11px*var(--fs,1));color:var(--ink2)}

/* ---------- list rows ---------- */
.row{display:flex;gap:13px;align-items:center;padding:13px 0;min-height:70px;border-top:1px solid var(--line2)}
.row:first-of-type{border-top:none}
.row .th{width:58px;height:58px;flex:0 0 58px;border-radius:8px;overflow:hidden;background:var(--surface2);
  display:flex;align-items:center;justify-content:center;font-size:calc(20px*var(--fs,1));border:1px solid var(--line)}
.row .th img{width:100%;height:100%;object-fit:cover}
.row .body{flex:1;min-width:0}
.row .body b{display:block;font-size:calc(15px*var(--fs,1));font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .body span{font-size:calc(12px*var(--fs,1));color:var(--ink2)}

.note{border-radius:var(--r-s);padding:11px 13px;font-size:calc(13px*var(--fs,1));line-height:1.65}
.note.amber{background:var(--amber-bg);color:var(--amber)}
.note.ok{background:var(--ok-bg);color:var(--ok)}
.note.indigo{background:var(--indigo-bg);color:var(--indigo-d)}

h2.sec{margin:26px 0 10px;font-size:calc(15px*var(--fs,1));font-weight:700}
h2.sec .c{font-weight:500;color:var(--ink3);font-size:calc(13px*var(--fs,1));margin-left:6px;font-variant-numeric:tabular-nums}

/* ---------- sheet ---------- */
.scrim{position:fixed;inset:0;background:rgba(8,18,22,.5);z-index:50;display:none}
.scrim.on{display:block}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:51;background:var(--bg);
  border-radius:18px 18px 0 0;max-height:92vh;overflow-y:auto;overflow-x:hidden;display:none;
  overscroll-behavior:contain;
  padding:0 16px calc(var(--safe-b) + 24px);-webkit-overflow-scrolling:touch}
.sheet.on{display:block}
.sheet .handle{width:38px;height:4px;border-radius:2px;background:var(--line);margin:9px auto 4px}
.sheet .shead{display:flex;align-items:center;justify-content:space-between;
  position:sticky;top:0;background:var(--bg);padding:8px 0 12px;z-index:2}
.sheet .shead h3{margin:0;font-size:calc(17px*var(--fs,1));font-weight:700}
.sheet .x{font-size:calc(16px*var(--fs,1));color:var(--indigo);padding:12px 6px 12px 18px;font-weight:700;min-height:48px}
.sheet .inner{max-width:588px;margin:0 auto}

.hero{width:100%;aspect-ratio:1;object-fit:cover;border-radius:var(--r);border:1px solid var(--line);background:var(--surface2);display:block}
.kv{display:grid;grid-template-columns:auto 1fr;gap:7px 16px;font-size:calc(13.5px*var(--fs,1));margin:14px 0}
.kv dt{color:var(--ink2)}
.kv dd{margin:0;font-weight:600;font-variant-numeric:tabular-nums}

.shot{width:100%;aspect-ratio:1;border-radius:18px;border:2px dashed var(--indigo);
  background:var(--indigo-bg);display:flex;flex-direction:column;align-items:center;
  justify-content:center;gap:12px;color:var(--indigo-d);font-size:calc(17px*var(--fs,1));font-weight:700}
.shot .g{font-size:calc(58px*var(--fs,1));line-height:1}
.shot img{width:100%;height:100%;object-fit:cover;border-radius:12px}
.shot.has{border-style:solid;border-color:var(--line);padding:0;overflow:hidden;background:var(--surface2)}

.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(var(--nav-h) + var(--safe-b) + 16px);
  background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:999px;font-size:calc(13.5px*var(--fs,1));
  font-weight:600;z-index:80;opacity:0;pointer-events:none;transition:opacity .2s}
.toast.on{opacity:1}
.sp{height:8px}
.cam{position:fixed;inset:0;z-index:70;background:#0B1418;display:none;
  flex-direction:column;align-items:center;justify-content:center;gap:18px;
  padding:calc(var(--safe-t) + 16px) 16px calc(var(--safe-b) + 20px)}
.cam.on{display:flex}
.cam-stage{position:relative;width:100%;max-width:520px;aspect-ratio:1;
  border-radius:18px;overflow:hidden;background:#000}
.cam-stage video{width:100%;height:100%;object-fit:cover;display:block}
.cam-guide{position:absolute;inset:4%;pointer-events:none}
.cam-guide i{position:absolute;width:30px;height:30px;border:3px solid rgba(255,255,255,.92)}
.cam-guide i:nth-child(1){top:0;left:0;border-right:none;border-bottom:none;border-radius:8px 0 0 0}
.cam-guide i:nth-child(2){top:0;right:0;border-left:none;border-bottom:none;border-radius:0 8px 0 0}
.cam-guide i:nth-child(3){bottom:0;left:0;border-right:none;border-top:none;border-radius:0 0 0 8px}
.cam-guide i:nth-child(4){bottom:0;right:0;border-left:none;border-top:none;border-radius:0 0 8px 0}
.cam-tip{margin:0;color:rgba(255,255,255,.82);font-size:calc(13.5px*var(--fs,1));text-align:center;line-height:1.7}
.cam-bar{display:flex;align-items:center;justify-content:space-between;width:100%;max-width:520px}
.cam-side{color:#fff;font-size:calc(15px*var(--fs,1));font-weight:700;padding:14px 10px;min-width:88px;min-height:52px}
.cam-shot{width:78px;height:78px;border-radius:50%;background:rgba(255,255,255,.22);
  display:flex;align-items:center;justify-content:center}
.cam-shot span{width:62px;height:62px;border-radius:50%;background:#fff;display:block}
.cam-shot:active span{transform:scale(.9)}
.stickybar{position:sticky;bottom:calc(var(--nav-h) + var(--safe-b) + 10px);z-index:20;
  display:flex;gap:9px;margin-top:16px;padding:11px;border-radius:16px;
  background:var(--surface);border:1px solid var(--line);
  box-shadow:0 8px 24px rgba(8,20,26,.14)}
.stickybar .btn{flex:1;min-width:0;padding-left:8px;padding-right:8px;font-size:calc(15px*var(--fs,1))}
.fc-head{display:flex;flex-direction:column;gap:2px;padding-bottom:10px;border-bottom:1px solid var(--line2);margin-bottom:6px}
.fc-head b{font-size:calc(15px*var(--fs,1));font-weight:700}
.fc-head span{font-size:calc(11.5px*var(--fs,1));color:var(--ink2);font-variant-numeric:tabular-nums}
.fc-row{display:flex;align-items:baseline;gap:10px;padding:7px 0}
.fc-row b{font-size:calc(15px*var(--fs,1));font-weight:700;min-width:58px}
.fc-row span{font-size:calc(12.5px*var(--fs,1));color:var(--ink2);flex:1}
.fc-row em{font-style:normal;font-size:calc(12.5px*var(--fs,1));font-weight:700}
.fc-row em.amber{color:var(--amber)}
.fc-row em.indigo{color:var(--ink2);font-weight:500}
.airow{display:flex;align-items:center;gap:12px;margin-top:12px}
.tile .owner{position:absolute;left:6px;top:6px;min-width:26px;height:26px;padding:0 6px;border-radius:13px;
  color:#fff;font-size:calc(12.5px*var(--fs,1));font-weight:700;display:flex;align-items:center;justify-content:center;
  box-shadow:0 0 0 2px var(--surface)}
.tile .qty{position:absolute;right:6px;bottom:6px;padding:3px 8px;border-radius:7px;
  background:var(--indigo);color:#fff;font-size:calc(11.5px*var(--fs,1));font-weight:700}
.chip.more{border-style:dashed;color:var(--indigo)}
.sizes-more{margin-top:8px}
/* hidden 属性を必ず効かせる（.chips や .act の display 指定に負けて表示されていた） */
[hidden]{display:none!important}
/* 格子に並べる（サイズ5列・色とシーズン4列）。カテゴリと同じ角丸の四角 */
.chips.g5,.chips.g4{display:grid;gap:8px}
.chips.g5{grid-template-columns:repeat(5,minmax(0,1fr))}
.chips.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
.chips.g5 .chip,.chips.g4 .chip{justify-content:center;padding:0 2px;min-height:46px;border-radius:12px;white-space:nowrap}
.chips.g5 .chip.more{grid-column:1/-1}
.chips.cgrid .chip{flex-direction:column;gap:5px;min-height:62px;font-size:calc(13px*var(--fs,1))}
.chips.cgrid .chip .sw{margin-right:0;width:20px;height:20px;border-radius:6px}
.chip.onfilter{background:var(--indigo-bg);border-color:var(--indigo);color:var(--indigo-d);margin:2px 0 6px}
.fc-card .fc-head b{display:flex;align-items:center}
.fc-card .fc-head .mdot{display:inline-block;width:11px;height:11px;border-radius:6px;margin-right:8px;flex:0 0 auto}
.fc-go{width:100%;text-align:left;border-top:1px solid var(--line2);min-height:50px}
.fc-go .chev{font-style:normal;color:var(--ink3);font-size:calc(20px*var(--fs,1));margin-left:2px}
.qtyctl{display:inline-flex;align-items:center;gap:10px}
.qtyctl button{width:38px;height:38px;border-radius:10px;border:1px solid var(--line);
  background:var(--surface2);font-size:calc(18px*var(--fs,1));font-weight:700;color:var(--ink)}
.dupbox{margin-top:14px;padding:12px;border-radius:14px;background:var(--amber-bg)}
.dupq{font-size:calc(14px*var(--fs,1));font-weight:700;color:var(--amber);margin-bottom:10px}
.duprow{display:grid;grid-template-columns:repeat(3,1fr);gap:9px}
.duppair{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:4px 0 12px}
.duppair figure{margin:0}
.duppair img,.duppair .ph{width:100%;aspect-ratio:1;object-fit:cover;border-radius:12px;
  border:1px solid var(--line);background:var(--surface2);display:flex;align-items:center;justify-content:center;font-size:calc(40px*var(--fs,1))}
.duppair figcaption{font-size:calc(12px*var(--fs,1));color:var(--ink2);text-align:center;margin-top:5px}
.act.col{flex-direction:column}
.act.col .btn{min-width:0}
.datebar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin:4px 0 12px}
.datebar .chip{padding:0 15px}
.datechip,.datebtn{position:relative;overflow:hidden;cursor:pointer}
.shead-act{display:flex;align-items:center;gap:2px}
.navbar{display:flex;align-items:center;gap:10px;margin:10px 0 0;font-size:calc(13px*var(--fs,1));color:var(--ink2);flex-wrap:wrap}
.navbar .navbtn{width:40px;height:40px;border-radius:12px;border:1px solid var(--line);background:var(--surface2);
  font-size:calc(22px*var(--fs,1));line-height:1;color:var(--ink);display:flex;align-items:center;justify-content:center}
.navbar .navbtn[disabled]{opacity:.3}
.navbar em{font-style:normal;font-size:calc(12px*var(--fs,1));color:var(--ink3);flex-basis:100%}
.hist .histph{width:44px;height:44px;flex:0 0 44px;border-radius:8px;overflow:hidden;padding:0;
  border:1px solid var(--line);background:var(--surface2);display:flex;align-items:center;justify-content:center;
  color:var(--ink3);font-size:calc(16px*var(--fs,1));font-style:normal;min-width:0}
.hist .histph img{width:100%;height:100%;object-fit:cover}
.hist .histph.none{border-style:dashed;opacity:.45}
.ptab{width:100%;border-collapse:collapse;font-size:calc(12.5px*var(--fs,1));margin-top:14px}
.ptab th,.ptab td{padding:8px 4px;text-align:center;border-bottom:1px solid var(--line2)}
.ptab tbody th{text-align:left;color:var(--ink2);font-weight:600}
.ptab .cur{background:var(--indigo-bg);color:var(--indigo-d);font-weight:700}
.homecard{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:16px 14px 14px;margin-top:2px}
.homehead{display:flex;align-items:baseline;justify-content:space-between;gap:10px;margin-bottom:10px}
.homehead b{font-size:calc(20px*var(--fs,1));font-weight:700}
.homehead span{font-size:calc(12.5px*var(--fs,1));color:var(--ink2)}
.shootbtn{margin-top:8px;min-height:58px;font-size:calc(17px*var(--fs,1))}
.center{text-align:center}
.homecard .datebar{margin:14px 0 12px}
/* ホームの記録パネル。下の参考情報と見分けがつくよう色と太枠で囲う */
.homecard.rec{background:var(--indigo-bg);border:2px solid var(--indigo)}
.homecard.rec .homehead b{color:var(--indigo-d)}
.homecard.rec .chip:not([aria-pressed="true"]){background:var(--surface)}
.homecard.rec .btn.sub{background:var(--surface);color:var(--ink)}
.wornstrip{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:6px;margin:2px 0 12px}
.wornstrip .tile{border-radius:10px}
.wornstrip .tile .ph{font-size:calc(18px*var(--fs,1))}

<script>
"use strict";

/* ============================================================
   定数
   ============================================================ */
const CATS = [
  {id:'tops',   n:'トップス', g:'👕'},
  {id:'bottoms',n:'ボトムス', g:'👖'},
  {id:'outer',  n:'アウター', g:'🧥'},
  {id:'dress',  n:'ワンピ',   g:'👗'},
  {id:'shoes',  n:'くつ',     g:'👟'},
  {id:'under',  n:'インナー', g:'🩲'},
  {id:'pajama', n:'パジャマ', g:'🌙'},
  {id:'goods',  n:'こもの',   g:'🧣'},
  {id:'other',  n:'その他',   g:'🧺'}
];
const COLORS = [
  {n:'ホワイト', hex:'#FFFFFF'}, {n:'ブラック', hex:'#1A1A1A'},
  {n:'グレー',   hex:'#8A9295'}, {n:'ネイビー', hex:'#22324F'},
  {n:'ブルー',   hex:'#3C6FB0'}, {n:'サックス', hex:'#9EC4DE'},
  {n:'グリーン', hex:'#3F7A4F'}, {n:'カーキ', hex:'#7A7550'},
  {n:'イエロー', hex:'#E0B93C'}, {n:'オレンジ', hex:'#D97B37'},
  {n:'レッド',   hex:'#B93A38'}, {n:'ピンク',   hex:'#DFA0AE'},
  {n:'パープル', hex:'#7A5C96'}, {n:'ブラウン', hex:'#7A5340'},
  {n:'ベージュ', hex:'#D6C3A5'}, {n:'柄物',     hex:'#B9AFA2'}
];
const SEASONS = ['春','夏','秋','冬'];
const MEMBER_COLORS = [
  {n:'ブルー',  hex:'#3F79B8'}, {n:'グリーン',hex:'#3E8C63'},
  {n:'オレンジ',hex:'#D2762F'}, {n:'ピンク',  hex:'#C96A8B'},
  {n:'パープル',hex:'#7A62A8'}, {n:'イエロー',hex:'#C08A1C'},
  {n:'レッド',  hex:'#B84B42'}, {n:'グレー',  hex:'#6B7B82'}
];
const memberHex = m => (MEMBER_COLORS.find(c=>c.n===m?.color)||MEMBER_COLORS[7]).hex;
const APP_VERSION = '0.9.1';   // MAJOR.MINOR.PATCH。1.0.0 をストア公開とする
const KID_SIZES = ['60','70','80','90','100','110','120','130','140','150','160'];
const ADULT_SIZES = ['XS','S','M','L','XL','XXL'];
const FREE_SIZE = 'F';         // フリーサイズ。数字ではないのでサイズアウト判定の対象外
const sizeLabel = s => String(s)===FREE_SIZE ? 'フリー' : String(s);
/* 靴のサイズ（cm）。0.5刻み */
function shoeStr(v){ return v%1 ? v.toFixed(1) : String(v) }
const SHOE_SIZES=[]; for(let v=12; v<=29; v+=0.5) SHOE_SIZES.push(shoeStr(v));
function shoeNum(s){ const n=parseFloat(s); return Number.isFinite(n)&&n>=10&&n<=32 ? n : null }
/* 靴の選択肢の中心。前に登録した靴があればそのサイズ、なければ年齢からの目安 */
function shoeCenter(m){
  const own=S.items.filter(i=>i.memberId===m?.id&&i.category==='shoes'&&shoeNum(i.size)!==null)
    .sort((a,b)=>String(b.id).localeCompare(String(a.id)));
  if(own.length) return shoeNum(own[0].size);
  const a=ageOf(m);
  if(a===null||a>15) return 25;
  return Math.min(24.5, Math.max(12, Math.round((12.5+a*0.95)*2)/2));
}
/* サイズの選択肢。本人に合う系統を先に出し、もう一方は折りたたむ。
   靴を選んだときは、よく使う前後2cmを先に出し、残りのcmとS・M・Lを折りたたむ */
function sizeChips(id, attr, selected, kid, cat, m){
  const sel = selected==null ? '' : String(selected);
  S._sizeMore = S._sizeMore || {};
  let main, other, more;
  if(cat==='shoes'){
    const c=shoeCenter(m);
    main = SHOE_SIZES.filter(v=>Math.abs(parseFloat(v)-c)<=2);
    other= [...SHOE_SIZES.filter(v=>!main.includes(v)), ...ADULT_SIZES];
    more = 'ほかのサイズ';
  }else{
    main = kid ? KID_SIZES : ADULT_SIZES;
    other= kid ? ADULT_SIZES : KID_SIZES;
    more = kid ? '大人のサイズ' : '子供のサイズ';
  }
  const open = S._sizeMore[id] || other.includes(sel);
  const chip = v => `<button class="chip" ${attr}="${v}" aria-pressed="${sel===String(v)}">${sizeLabel(v)}</button>`;
  return `<div class="chips g5" id="${id}">${main.map(chip).join('')}${chip(FREE_SIZE)}
      <button class="chip more" data-sizemore="${id}" data-more="${more}">${open?'閉じる':'＋'+more}</button></div>
    <div class="chips g5 sizes-more" id="${id}-more" ${open?'':'hidden'}>${other.map(chip).join('')}</div>`;
}
const API_BASE = 'https://kazokuro-api.ishimonzukan.workers.dev';  // AI判別を中継するWorker
const STALE_DAYS = 120;      // これ以上着ていなければ「眠っている服」
const MERCARI_MIN = 300;
const SIZE_MARGIN = 5;       // 「110サイズ」は身長115cmくらいまで着られる、という目安
/* 年齢別の年間身長増加量（cm/年）の目安。実測が2回以上あればそちらを優先する */
const GROWTH_BY_AGE = [
  [0,25],[1,12],[2,8],[3,7],[4,6.5],[5,6.5],[6,6],[7,6],[8,6],
  [9,6],[10,6.5],[11,7],[12,6.5],[13,5],[14,3],[15,1.5],[16,0.8],[17,0.4],[18,0]
];

/* ============================================================
   IndexedDB
   ============================================================ */
const DB_NAME='kazoku-closet', DB_VER=4;
let db=null;

function openDB(){
  return new Promise((res,rej)=>{
    const r=indexedDB.open(DB_NAME,DB_VER);
    r.onupgradeneeded=e=>{
      const d=e.target.result;
      if(!d.objectStoreNames.contains('members')) d.createObjectStore('members',{keyPath:'id'});
      if(!d.objectStoreNames.contains('items')){
        const s=d.createObjectStore('items',{keyPath:'id'});
        s.createIndex('memberId','memberId',{unique:false});
      }
      if(!d.objectStoreNames.contains('wears')){
        const s=d.createObjectStore('wears',{keyPath:'id'});
        s.createIndex('itemId','itemId',{unique:false});
      }
      if(!d.objectStoreNames.contains('photos')) d.createObjectStore('photos',{keyPath:'id'});
      if(!d.objectStoreNames.contains('thumbs')) d.createObjectStore('thumbs',{keyPath:'id'});
      if(!d.objectStoreNames.contains('outfits')) d.createObjectStore('outfits',{keyPath:'id'});
      if(!d.objectStoreNames.contains('growth')){
        const s=d.createObjectStore('growth',{keyPath:'id'});
        s.createIndex('memberId','memberId',{unique:false});
      }
    };
    r.onsuccess=()=>{db=r.result;res(db)};
    r.onerror=()=>rej(r.error);
  });
}
function txDone(t){return new Promise((res,rej)=>{t.oncomplete=()=>res();t.onabort=t.onerror=()=>rej(t.error)})}
async function dbPut(store,val){const t=db.transaction(store,'readwrite');t.objectStore(store).put(val);await txDone(t);return val}
async function dbDel(store,id){const t=db.transaction(store,'readwrite');t.objectStore(store).delete(id);await txDone(t)}
function dbAll(store){return new Promise((res,rej)=>{const r=db.transaction(store,'readonly').objectStore(store).getAll();r.onsuccess=()=>res(r.result||[]);r.onerror=()=>rej(r.error)})}
function dbGet(store,id){return new Promise((res,rej)=>{const r=db.transaction(store,'readonly').objectStore(store).get(id);r.onsuccess=()=>res(r.result||null);r.onerror=()=>rej(r.error)})}

/* v0.3より前は写真IDを服に書き忘れていた。IDに含まれる時刻で突き合わせて復旧する */
async function repairPhotoLinks(){
  const orphans=S.items.filter(i=>!i.photoId);
  if(!orphans.length) return 0;
  const used=new Set(S.items.map(i=>i.photoId).filter(Boolean));
  const free=(await dbKeys('photos'))
    .filter(k=>!used.has(k))
    .map(k=>({id:k,t:parseInt(String(k).slice(0,8),36)}))
    .filter(p=>Number.isFinite(p.t));
  if(!free.length) return 0;
  let fixed=0;
  for(const it of orphans){
    const t=parseInt(String(it.id).slice(0,8),36);
    if(!Number.isFinite(t)) continue;
    let best=null,bd=Infinity;
    for(const p of free){ const gap=Math.abs(p.t-t); if(gap<bd){bd=gap;best=p} }
    if(best&&bd<=2000){
      it.photoId=best.id;
      await dbPut('items',it);
      free.splice(free.indexOf(best),1);
      fixed++;
    }
  }
  if(fixed) await reload();
  return fixed;
}

  if(!S.settings.startedAt){ S.settings.startedAt=Date.now(); saveSettings() }

const urlCache=new Map();

/* 大きい写真（詳細・比較用）。メモリを食うので直近12枚だけ持つ */
async function photoURL(id){
  if(!id) return null;
  if(urlCache.has(id)){ const u=urlCache.get(id); urlCache.delete(id); urlCache.set(id,u); return u }
  const p=await dbGet('photos',id);
  if(!p) return null;
  const u=URL.createObjectURL(p.blob);
  urlCache.set(id,u);
  while(urlCache.size>12){ const [k,v]=urlCache.entries().next().value; URL.revokeObjectURL(v); urlCache.delete(k) }
  return u;
}
/* 一覧用の小さい写真（240px）。900pxの写真を一覧に並べると1枚約3MBのメモリを使い、
   200着で約650MBになってSafariが落ちる。240pxなら1枚約0.2MB */
const thumbCache=new Map();
const THUMB=240;
async function makeThumb(blob){
  const bmp=await loadBitmap(blob);
  const w=bmp.width||bmp.naturalWidth, h=bmp.height||bmp.naturalHeight, sq=Math.min(w,h);
  const cv=document.createElement('canvas'); cv.width=THUMB; cv.height=THUMB;
  const cx=cv.getContext('2d'); cx.imageSmoothingEnabled=true; cx.imageSmoothingQuality='high';
  cx.drawImage(bmp,(w-sq)/2,(h-sq)/2,sq,sq,0,0,THUMB,THUMB);
  if(bmp.close) bmp.close();
  return new Promise(r=>cv.toBlob(r,'image/jpeg',0.75));
}
/* なければその場で作って保存する。古いデータも、表示されたものから順に作られていく */
async function thumbURL(id){
  if(!id) return null;
  if(thumbCache.has(id)) return thumbCache.get(id);
  let t=await dbGet('thumbs',id);
  if(!t){
    const p=await dbGet('photos',id); if(!p) return null;
    try{ t={id,blob:await makeThumb(p.blob)}; await dbPut('thumbs',t) }catch(e){ return null }
  }
  const u=URL.createObjectURL(t.blob);
  thumbCache.set(id,u);
  return u;
}

/* 一覧用の短い表記：今日 / 昨日 / N日前 / Nヶ月前 / N年前 */
function agoLabel(s){
  const d=daysSince(s); if(d===null) return '';
  if(d<=0) return '今日';
  if(d===1) return '昨日';
  if(d<30)  return d+'日前';
  if(d<365) return Math.min(11,Math.floor(d/30))+'ヶ月前';
  return Math.floor(d/365)+'年前';
}
/* 経過期間：「2年5ヶ月」「5ヶ月」「12日」 */
function elapsed(s){
  const d=daysSince(s); if(d===null) return '';
  if(d<31) return d<=0?'0日':d+'日';
  const b=new Date(s+'T00:00:00'), n=new Date();
  let m=(n.getFullYear()-b.getFullYear())*12+(n.getMonth()-b.getMonth());
  if(n.getDate()<b.getDate()) m--;
  m=Math.max(1,m);
  const y=Math.floor(m/12), r=m%12;
  return (y?y+'年':'')+(r?r+'ヶ月':'');
}

/* ============================================================
   画像処理：リサイズ + 代表色の推定
   ============================================================ */
async function loadBitmap(file){
  if(window.createImageBitmap){
    try{ return await createImageBitmap(file) }catch(e){}
  }
  return new Promise((res,rej)=>{
    const fr=new FileReader();
    fr.onload=()=>{const im=new Image();im.onload=()=>res(im);im.onerror=rej;im.src=fr.result};
    fr.onerror=rej; fr.readAsDataURL(file);
  });
}
const OUT_SIZE = 900;          // 仕上がりの一辺
const SUBJECT_FILL = 0.84;     // 服が枠に占める割合。これで大きさが揃う

/* 被写体の範囲を求める。背景と色が違う画素の広がりを見る */
function subjectBox(cx,w,h,bg){
  const d=cx.getImageData(0,0,w,h).data;
  const col=new Int32Array(w), row=new Int32Array(h);
  const TH=62;
  for(let y=0;y<h;y+=2){
    for(let x=0;x<w;x+=2){
      const i=(y*w+x)*4;
      if(Math.abs(d[i]-bg[0])+Math.abs(d[i+1]-bg[1])+Math.abs(d[i+2]-bg[2])>TH){ col[x]++; row[y]++ }
    }
  }
  const colTh=Math.max(3,Math.round(h*0.012)), rowTh=Math.max(3,Math.round(w*0.012));
  let minX=w,maxX=-1,minY=h,maxY=-1;
  for(let x=0;x<w;x++) if(col[x]>colTh){ if(x<minX)minX=x; if(x>maxX)maxX=x }
  for(let y=0;y<h;y++) if(row[y]>rowTh){ if(y<minY)minY=y; if(y>maxY)maxY=y }
  if(maxX<0||maxY<0) return null;
  const bw=maxX-minX, bh=maxY-minY;
  const ratio=(bw*bh)/(w*h);
  if(ratio<0.03||ratio>0.985) return null;   // 検出できなかったとみなす
  return {minX,minY,bw,bh};
}

/* 背景を白に寄せ、服を中央に同じ大きさで切り出す */
/* 仕上げの強さ。旧設定（normalize:true/false）からも引き継ぐ */
function finishLevel(){
  const f=S.settings.finish;
  if(f==='strong'||f==='soft'||f==='off') return f;
  return S.settings.normalize===false ? 'off' : 'soft';
}
function normalize(work,wcx,w,h,level='soft'){
  const bg=sampleEdge(wcx,w,h)||[235,235,235];
  const box=subjectBox(wcx,w,h,bg);
  let sx,sy,ss;
  if(box){
    ss=Math.max(box.bw,box.bh)/SUBJECT_FILL;
    sx=box.minX+box.bw/2-ss/2;
    sy=box.minY+box.bh/2-ss/2;
  }else{
    ss=Math.min(w,h); sx=(w-ss)/2; sy=(h-ss)/2;
  }
  const out=document.createElement('canvas');
  out.width=OUT_SIZE; out.height=OUT_SIZE;
  const ocx=out.getContext('2d',{willReadFrequently:true});
  ocx.fillStyle='#ffffff'; ocx.fillRect(0,0,OUT_SIZE,OUT_SIZE);
  ocx.drawImage(work,sx,sy,ss,ss,0,0,OUT_SIZE,OUT_SIZE);

  // 背景が明るいときだけ、そこを白の基準にして色かぶりと露出を補正する
  const lum=0.299*bg[0]+0.587*bg[1]+0.114*bg[2];
  if(lum>85){
    // ひかえめ：持ち上げは1.3倍まで・色かぶり補正は半分。しっかり：以前に近い強さ
    const P = level==='strong' ? {t:262,max:1.9,cast:1} : {t:250,max:1.3,cast:0.5};
    const lg=P.t/Math.max(1,lum);
    const gain=[bg[0],bg[1],bg[2]].map(c=>{
      const g=lg*(1-P.cast)+(P.t/Math.max(1,c))*P.cast;
      return Math.max(0.8,Math.min(P.max,g));
    });
    // 明るい部分は頭打ちにせず寝かせる。白い服の陰影が残る
    const KNEE=225, R=255-KNEE;
    const lut=new Uint8ClampedArray(768);
    for(let v=0;v<768;v++) lut[v]= v<=KNEE ? v : KNEE+R*(1-Math.exp(-(v-KNEE)/R));
    const im=ocx.getImageData(0,0,OUT_SIZE,OUT_SIZE), od=im.data;
    for(let i=0;i<od.length;i+=4){
      od[i]  =lut[Math.min(767,od[i]  *gain[0]|0)];
      od[i+1]=lut[Math.min(767,od[i+1]*gain[1]|0)];
      od[i+2]=lut[Math.min(767,od[i+2]*gain[2]|0)];
    }
    ocx.putImageData(im,0,0);
  }
  return out;
}

/* 正規化しない場合：中央を正方形に切るだけ */
function plainSquare(work,w,h){
  const s=Math.min(w,h);
  const out=document.createElement('canvas');
  out.width=OUT_SIZE; out.height=OUT_SIZE;
  const ocx=out.getContext('2d');
  ocx.fillStyle='#ffffff'; ocx.fillRect(0,0,OUT_SIZE,OUT_SIZE);
  ocx.drawImage(work,(w-s)/2,(h-s)/2,s,s,0,0,OUT_SIZE,OUT_SIZE);
  return out;
}

/* File でも Canvas でも受け取り、正規化した JPEG と推定色を返す */
async function processPhoto(source){
  const isCanvas = source instanceof HTMLCanvasElement;
  const src = isCanvas ? source : await loadBitmap(source);
  const sw=src.width||src.naturalWidth, sh=src.height||src.naturalHeight;
  const sc=Math.min(1,1200/Math.max(sw,sh));
  const w=Math.round(sw*sc), h=Math.round(sh*sc);
  const work=document.createElement('canvas'); work.width=w; work.height=h;
  const wcx=work.getContext('2d',{willReadFrequently:true});
  wcx.drawImage(src,0,0,w,h);

  const color=guessColor(wcx,w,h);
  const out=finishLevel()==='off' ? plainSquare(work,w,h) : normalize(work,wcx,w,h,finishLevel());
  const blob=await new Promise(r=>out.toBlob(r,'image/jpeg',0.78));
  if(!isCanvas && src.close) src.close();
  return {blob,color};
}
/* 外周から背景色を推定する（床・ベッド・テーブルなど） */
function sampleEdge(cx,w,h){
  const ew=Math.max(1,Math.round(w*0.07)), eh=Math.max(1,Math.round(h*0.07));
  const strips=[cx.getImageData(0,0,w,eh).data, cx.getImageData(0,h-eh,w,eh).data,
                cx.getImageData(0,0,ew,h).data, cx.getImageData(w-ew,0,ew,h).data];
  let r=0,g=0,b=0,n=0;
  for(const d of strips) for(let i=0;i<d.length;i+=40){ r+=d[i];g+=d[i+1];b+=d[i+2];n++ }
  return n?[r/n,g/n,b/n]:null;
}
/* 中央部の最頻色。bg を渡すとそれに近い画素を無視する */
function tallyCenter(cx,w,h,bg){
  const x0=Math.round(w*0.22), y0=Math.round(h*0.22);
  const cw=Math.max(1,Math.round(w*0.56)), ch=Math.max(1,Math.round(h*0.56));
  const d=cx.getImageData(x0,y0,cw,ch).data;
  const buckets=new Map();
  let kept=0;
  for(let i=0;i<d.length;i+=16){
    const r=d[i],g=d[i+1],b=d[i+2];
    if(bg && Math.abs(r-bg[0])+Math.abs(g-bg[1])+Math.abs(b-bg[2])<54) continue;
    const k=(r>>4)*256+(g>>4)*16+(b>>4);
    const e=buckets.get(k)||[0,0,0,0];
    e[0]+=r;e[1]+=g;e[2]+=b;e[3]++; buckets.set(k,e); kept++;
  }
  if(kept<60) return null;
  let best=null,bc=0;
  for(const e of buckets.values()){ if(e[3]>bc){bc=e[3];best=e} }
  if(!best) return null;
  return [best[0]/best[3], best[1]/best[3], best[2]/best[3]];
}
function nearestColorName(rgb){
  const [r,g,b]=rgb;
  let nearest=null,nd=1e9;
  for(const c of COLORS){
    if(c.n==='柄物') continue;
    const cr=parseInt(c.hex.slice(1,3),16), cg=parseInt(c.hex.slice(3,5),16), cb=parseInt(c.hex.slice(5,7),16);
    const dist=(r-cr)**2*0.3+(g-cg)**2*0.59+(b-cb)**2*0.11;
    if(dist<nd){nd=dist;nearest=c.n}
  }
  return nearest;
}
function guessColor(cx,w,h){
  try{
    const bg=sampleEdge(cx,w,h);
    // まず背景を除いて集計。服が画面いっぱいで何も残らなければ除外なしで再集計
    const rgb=tallyCenter(cx,w,h,bg)||tallyCenter(cx,w,h,null);
    return rgb?nearestColorName(rgb):null;
  }catch(e){ return null }
}

/* ============================================================
   判定ロジック
   ============================================================ */
/* ---- 身長と成長のモデル ---------------------------------- */

/* そのメンバーの身長記録（古い順） */
function heightsOf(mid){
  return S.growth.filter(g=>g.memberId===mid).sort((a,b)=>a.date.localeCompare(b.date));
}
/* 年齢から平均的な年間成長量を引く */
function avgGrowth(age){
  if(age===null||age===undefined) return null;
  let r=GROWTH_BY_AGE[0][1];
  for(const [a,v] of GROWTH_BY_AGE){ if(age>=a) r=v }
  return r;
}
/* 現在の推定身長と成長ペース。記録がなければ null */
function growthInfo(m){
  if(!m) return null;
  // 「年齢の平均」で入れた身長は、実際に測った記録が1つでもあればそちらを使う
  const all=heightsOf(m.id), real=all.filter(h=>!h.est);
  const hs=real.length?real:all;
  if(!hs.length) return null;
  const last=hs[hs.length-1];
  let rate=null, source='平均';
  if(hs.length>=2){
    const first=hs[0];
    const days=(new Date(last.date+'T00:00:00')-new Date(first.date+'T00:00:00'))/86400000;
    if(days>=60){
      const r=(last.height-first.height)/days*365;
      if(r>0.3&&r<30){ rate=r; source='実測' }
    }
  }
  if(rate===null) rate=avgGrowth(ageOf(m));
  if(rate===null) return null;
  const elapsedY=Math.max(0,(daysSince(last.date)||0)/365);
  const nowH=last.height+rate*elapsedY;
  return {measured:last.height, measuredAt:last.date, nowH, rate, source:real.length?source:'年齢の平均', count:hs.length, est:!real.length};
}
/* 年齢ごとの平均身長の目安（男女の中間・cm）。身長が分からないときの仮の値に使う */
const AVG_HEIGHT=[[0,50],[1,75],[2,87],[3,95],[4,102],[5,109],[6,116],[7,122],[8,128],[9,134],
  [10,139],[11,146],[12,152],[13,157],[14,161],[15,163]];
function avgHeightFor(birthday,date){
  if(!birthday) return null;
  const y=(new Date((date||today())+'T00:00:00')-new Date(birthday+'T00:00:00'))/(365.25*86400000);
  if(!(y>=0)||y>15) return null;
  const i=Math.min(AVG_HEIGHT.length-2,Math.floor(y)), [a0,h0]=AVG_HEIGHT[i], [a1,h1]=AVG_HEIGHT[i+1];
  return Math.round((h0+(h1-h0)*(y-a0)/(a1-a0))*10)/10;
}
/* 身長 → 今ちょうど良いサイズ（10cm刻み） */
/* 身長 → 今ちょうど良い子供服サイズ。子供服の最大（160）を超える身長は大人サイズなので null */
function fitSize(h){
  if(!Number.isFinite(h) || h>=165) return null;
  return Math.max(60,Math.round(h/10)*10);
}
function fitSizeText(h){
  const f=fitSize(h);
  return f ? `今ちょうど良いのは ${f}cm です。` : '子供服の最大サイズを超えています。大人サイズを選んでください。';
}
/* そのサイズがあと何ヶ月着られるか。すでに越えていれば負の値 */
function monthsLeft(m,size){
  const g=growthInfo(m); if(!g) return null;
  const s=Number(size); if(!Number.isFinite(s)) return null;
  if(g.rate<=0) return 999;
  return (s+SIZE_MARGIN-g.nowH)/g.rate*12;
}
function monthsLabel(mo){
  if(mo===null) return null;
  if(mo<=0)  return 'サイズアウト';
  if(mo<1)   return 'あと1ヶ月未満';
  if(mo>=24) return 'まだ余裕あり';
  return 'あと約'+Math.round(mo)+'ヶ月';
}

/* ---- 判定 ------------------------------------------------ */
function isActive(it){ return (it.status||'active')==='active' }

/* サイズアウト：身長記録があれば身長で、なければ登録サイズで判定 */
function isOutgrown(it){
  if(!isActive(it)) return false;
  const m=memberOf(it.memberId); if(!m) return false;
  if(!isKidMember(m)) return false;          // 大人の服はサイズアウトしない
  const s=sizeNum(it.size); if(s===null) return false;
  const g=growthInfo(m);
  if(g) return (s+SIZE_MARGIN) < g.nowH;
  const cur=sizeNum(m.currentSize);
  return cur!==null && s<cur;
}
/* 眠っている服 */
function isStale(it){
  if(!isActive(it)) return false;
  if(isOutgrown(it)) return false;
  const d=daysSince(it.lastWorn||it.addedAt);
  return d!==null && d>=STALE_DAYS;
}
/* 今のその人のサイズ（身長優先） */
function currentSizeOf(m){
  // 大人は身長から数字のサイズを出さない。おさがり先に大人が選ばれないようにする
  const g=growthInfo(m);
  if(g && isKidMember(m)){ const f=fitSize(g.nowH); if(f) return f }
  return isKidMember(m) ? sizeNum(m?.currentSize) : null;
}
/* おさがり：サイズアウト品を、今それが合う別メンバーへ */
function handDownTarget(it){
  const s=sizeNum(it.size); if(s===null) return null;
  for(const m of S.members){
    if(m.id===it.memberId) continue;
    const cur=currentSizeOf(m);
    if(cur===null) continue;
    if(s>=cur && s<=cur+10) return m;     // 今ぴったり〜1サイズ上まで
  }
  return null;
}
/* サイズ別の残り期間。持っている服をサイズごとにまとめて、近い順に返す */
function outgrowForecast(m){
  const g=growthInfo(m); if(!g) return null;
  const age=ageOf(m); if(age!==null&&age>15) return null;
  const bySize=new Map();
  for(const i of S.items){
    if(i.memberId!==m.id||!isActive(i)) continue;
    const s=sizeNum(i.size); if(s===null) continue;
    bySize.set(s,(bySize.get(s)||0)+1);
  }
  const rows=[...bySize.entries()]
    .map(([size,count])=>({size,count,months:monthsLeft(m,size)}))
    .filter(r=>r.months!==null&&r.months<18)
    .sort((a,b)=>a.months-b.months);
  return {g,age,rows};
}
/* 子どもとして扱うか。生年月日がなくても、身長か数字のサイズがあれば子どもとみなす */
function isKidMember(m){
  const a=ageOf(m);
  if(a!==null) return a<=15;
  return heightsOf(m.id).length>0 || sizeNum(m.currentSize)!==null;
}
/* 予測カード。予測できないときも黙って消さず、何が足りないかを出す */
function forecastCard(m){
  const age=ageOf(m);
  const head=`<div class="fc-head"><b><span class="mdot" style="background:${memberHex(m)}"></span>${esc(m.name)}</b>`;

  if(age===null){

      ${ask('身長を記録すると、持っている服があと何ヶ月着られるか出ます。タップして入力')}</div>`;

  }else if(!sized){

    ${body}
    <div class="tiny muted" style="margin-top:10px">${fitSizeText(g.nowH)}${g.source==='平均'?'身長を2回以上記録すると、この子の実際のペースで計算します。':''}</div>
  </div>`;
}

/* ---- 重複の検出 ------------------------------------------ */
/* 見た目の指紋。12x12の色つき縮小画像を4bitで持つ。
   背景が白に揃っているので、白い部分同士は差ゼロとして素直に一致する。
   （隣の画素との明暗を比べる dHash は、平坦な背景でノイズに振り回されるので使わない） */
async function photoSig(blob){
  try{
    const bmp=await loadBitmap(blob);
    const mid=document.createElement('canvas'); mid.width=96; mid.height=96;   // 一度に縮めると間引きになるので2段階
    const mx=mid.getContext('2d'); mx.imageSmoothingEnabled=true; mx.imageSmoothingQuality='high';
    mx.drawImage(bmp,0,0,96,96);
    if(bmp.close) bmp.close();
    const N=12, cv=document.createElement('canvas'); cv.width=N; cv.height=N;
    const cx=cv.getContext('2d',{willReadFrequently:true});
    cx.imageSmoothingEnabled=true; cx.imageSmoothingQuality='high';
    cx.drawImage(mid,0,0,N,N);
    const d=cx.getImageData(0,0,N,N).data;
    let hex='';
    for(let i=0;i<d.length;i+=4) hex+=(d[i]>>4).toString(16)+(d[i+1]>>4).toString(16)+(d[i+2]>>4).toString(16);
    return hex;
  }catch(e){ return null }
}
/* 0（同一）〜15（真逆）。検証では同じ服の撮り直しが0.5前後、形も色も同じ別の服が0.9前後 */
/* 服が数百着あると組み合わせが数万になるので、文字列から数値への変換は1回だけにする */
const hexCache=new Map();
function hexArr(str,w){
  const key=w+str; let v=hexCache.get(key);
  if(!v){
    v=new Uint8Array(str.length/w);
    for(let i=0;i<v.length;i++) v[i]=parseInt(str.substr(i*w,w),16);
    hexCache.set(key,v);
  }
  return v;
}
function sigDist(a,b){
  if(!a||!b||a.length!==b.length) return 99;
  const x=hexArr(a,1), y=hexArr(b,1);
  let t=0;
  for(let i=0;i<x.length;i++) t+=Math.abs(x[i]-y[i]);
  return t/x.length;
}
const DUP_THRESHOLD = 0.9;  // これ以下を「同じ服かもしれない」とみなす。実データで調整する

/* 写る位置・背景が変わっても比べられる特徴。写真の中央60%だけを見る（服は中央に撮るので背景やハンガーが入りにくい）
   h＝色の割合（RGB各4段階の64区分・100分率）、t＝柄の細かさ（明るさの変化の強さを8段階に分けた割合）
   色は隣の区分にも按分する。仕上げで明るさが少し変わっても、区分の境目をまたいで数字が跳ねないように */
const FEAT_V=1;
async function photoFeat(blob){
  try{
    const bmp=await loadBitmap(blob);
    const N=64, cv=document.createElement('canvas'); cv.width=N; cv.height=N;
    const cx=cv.getContext('2d',{willReadFrequently:true});
    cx.imageSmoothingEnabled=true; cx.imageSmoothingQuality='high';
    cx.drawImage(bmp,0,0,N,N);
    if(bmp.close) bmp.close();
    const d=cx.getImageData(0,0,N,N).data;
    const gray=new Float32Array(N*N);
    for(let p=0;p<N*N;p++) gray[p]=0.3*d[p*4]+0.59*d[p*4+1]+0.11*d[p*4+2];
    const a=Math.round(N*0.2), z=Math.round(N*0.8);
    const hist=new Array(64).fill(0), tex=new Array(8).fill(0);
    let n=0;
    for(let y=a;y<z;y++) for(let x=a;x<z;x++){
      const i=(y*N+x)*4;
      const fr=d[i]/85, fg=d[i+1]/85, fb=d[i+2]/85;
      const r0=Math.min(2,fr|0), g0=Math.min(2,fg|0), b0=Math.min(2,fb|0);
      const wr=fr-r0, wg=fg-g0, wb=fb-b0;
      for(let dr=0;dr<2;dr++) for(let dg=0;dg<2;dg++) for(let db=0;db<2;db++)
        hist[(r0+dr)*16+(g0+dg)*4+(b0+db)] += (dr?wr:1-wr)*(dg?wg:1-wg)*(db?wb:1-wb);
      const gx=gray[y*N+x+1]-gray[y*N+x-1], gy=gray[(y+1)*N+x]-gray[(y-1)*N+x];
      tex[Math.min(7,Math.floor(Math.hypot(gx,gy)/12))]++;
      n++;
    }
    const pack=arr=>arr.map(c=>Math.round(c/n*100).toString(16).padStart(2,'0')).join('');
    return {v:FEAT_V,h:pack(hist),t:pack(tex)};
  }catch(e){ return null }
}
/* 割合どうしの重なり（0〜1）。1に近いほど同じ */
function overlap(a,b){
  if(!a||!b||a.length!==b.length) return 0;
  const x=hexArr(a,2), y=hexArr(b,2);
  let t=0;
  for(let i=0;i<x.length;i++) t+=Math.min(x[i],y[i]);
  return t/100;
}
/* 色×柄の重なりがこれ以上なら候補。実際の写真10着（同じカテゴリどうし）で、
   同じチェックシャツの平置きとハンガー掛けが0.81（仕上げをかけ直しても0.73）、
   別の服は青の半袖と長袖が0.77で候補に入り、その次は0.66以下だった。まだ10着で決めた値なので、使いながら調整する */
const DUP_FEAT=0.7;
/* 同じ服かもしれない度合い。候補でなければ null、小さいほど似ている */
function dupScore(a,b){
  if(a.category&&b.category&&a.category!==b.category) return null;
  const px=(a.sig&&b.sig)?sigDist(a.sig,b.sig):99;
  if(px<=DUP_THRESHOLD) return px/DUP_THRESHOLD*0.3;           // 撮り直しなど、写り方までほぼ同じ
  // 柄がはっきり違う（無地とチェックなど）ときは、色が近くても別の服とみなす
  if(a.pattern&&b.pattern&&a.pattern!==b.pattern) return null;
  const f=overlap(a.feat?.h,b.feat?.h)*overlap(a.feat?.t,b.feat?.t);
  return f>=DUP_FEAT ? 1-f : null;
}
function notDupPair(a,b){ return (a.notDup||[]).includes(b.id)||(b.notDup||[]).includes(a.id) }
function dupCandidates(d){
  if(!d?.sig&&!d?.feat) return [];
  const skip=new Set(d.dupDismissed||[]);
  return S.items
    .filter(i=>isActive(i)&&(i.sig||i.feat)&&!skip.has(i.id))
    .map(i=>({i, dist: dupScore(d,i)}))
    .filter(x=>x.dist!=null)
    .map(x=>({...x, dist:x.dist-(d.memberId&&x.i.memberId===d.memberId ? 0.05 : 0)}))
    .sort((a,b)=>a.dist-b.dist)
    .slice(0,3)
    .map(x=>x.i);
}
/* 登録済みの服どうしで、同じ服かもしれない組 */
let dupMemo=null;
function dupPairs(){
  if(dupMemo&&dupMemo.items===S.items) return dupMemo.pairs;   // 読み直すまでは同じ結果
  const act=S.items.filter(i=>isActive(i)&&(i.sig||i.feat));
  const out=[];
  for(let x=0;x<act.length;x++) for(let y=x+1;y<act.length;y++){
    const a=act[x], b=act[y];
    if(notDupPair(a,b)) continue;
    const sc=dupScore(a,b);
    if(sc!=null) out.push({a,b,sc:sc-(a.memberId===b.memberId?0.05:0)});
  }
  out.sort((p,q)=>p.sc-q.sc);
  dupMemo={items:S.items,pairs:out};
  return out;
}
/* ブラウザに「このデータは消さないで」と申請する */
async function requestPersist(){
  try{
    if(!navigator.storage||!navigator.storage.persist){ S._persisted=false; return }
    let ok=await navigator.storage.persisted();
    if(!ok) ok=await navigator.storage.persist();
    S._persisted=!!ok;
  }catch(e){ S._persisted=false }
}
async function backfillHashes(){
  let n=0;
  for(const it of S.items){
    if((it.sig&&it.feat?.v===FEAT_V)||!it.photoId) continue;
    const p=await dbGet('photos',it.photoId);
    if(!p) continue;
    if(!it.sig) it.sig=await photoSig(p.blob);
    if(it.feat?.v!==FEAT_V) it.feat=await photoFeat(p.blob);
    await dbPut('items',it); n++;
  }
  if(n){ dupMemo=null; if(S.view==='closet') renderCloset() }     // 重複のお知らせを出し直す
}
/* 並び順。IDは作成時刻から始まるので、IDで比べれば同じ日に登録した服も正しく並ぶ */
const SORTS=[
  ['new','登録が新しい順'],['old','登録が古い順'],['recent','最近着た順'],
  ['idle','長く着ていない順'],['often','よく着る順'],['size','サイズ順'],['age','買った時期が古い順']];
function sortItems(list,key){
  const byId=(a,b)=>String(a.id).localeCompare(String(b.id));
  const lw=i=>i.lastWorn||'';
  const idle=i=>i.lastWorn||i.addedAt||'';
  const bought=i=>i.purchaseDate||i.addedAt||'';
  const sz=i=>{ const n=sizeNum(i.size); if(n!==null) return n;
    const k=ADULT_SIZES.indexOf(String(i.size)); return k>=0 ? 1000+k : (String(i.size)===FREE_SIZE ? 1100 : 2000) };
  const f={
    new:   (a,b)=>byId(b,a),
    old:   (a,b)=>byId(a,b),
    recent:(a,b)=>lw(b).localeCompare(lw(a))||byId(b,a),
    idle:  (a,b)=>idle(a).localeCompare(idle(b))||byId(a,b),
    often: (a,b)=>(b.wearCount||0)-(a.wearCount||0)||byId(b,a),
    size:  (a,b)=>sz(a)-sz(b)||byId(b,a),
    age:   (a,b)=>bought(a).localeCompare(bought(b))||byId(a,b)
  }[key] || ((a,b)=>byId(b,a));
  return list.slice().sort(f);
}
function ownerBadge(it){
  if(S.fMember!=='all') return '';
  const m=memberOf(it.memberId); if(!m) return '';
  return `<span class="owner" style="background:${memberHex(m)}">${esc(badgeText(m))}</span>`;

/* 頭文字。「一」「ー」などは記号に見えるので2文字にする */
function badgeText(m){
  const n=String(m?.name||'?').trim();
  return /^[一ー－\-‐・]/.test(n) ? n.slice(0,2) : n.slice(0,1);
}
function qtyBadge(it){ return (it.qty||1)>1 ? `<span class="qty">×${it.qty}</span>` : '' }
/* メルカリ想定価格（目安） */
function estPrice(it){
  const p=Number(it.price);
  if(!Number.isFinite(p)||p<=0) return null;
  const y=it.purchaseDate?Math.max(0,daysSince(it.purchaseDate)/365):1;

}
function listingText(it){
  const m=memberOf(it.memberId), c=catOf(it.category);

  L.push('');
  L.push('■カテゴリ：'+c.n);
  if(it.size)  L.push('■サイズ：'+it.size);
  if(it.color) L.push('■カラー：'+it.color);
  if(brand)    L.push('■ブランド：'+brand);
  if(it.season&&it.season.length) L.push('■シーズン：'+it.season.join('・'));
  L.push('■着用回数：'+(it.wearCount||0)+'回');
  L.push('■状態：目立った傷や汚れなし');
  L.push('');
  L.push(isOutgrown(it)
    ? '子どもの成長に伴いサイズアウトしたため出品します。'
    : 'あまり着る機会がなくなったため出品します。');
  L.push('自宅保管品のため、神経質な方はご購入をお控えください。');
  L.push('');
  L.push('#'+c.n+' '+(it.size?'#'+it.size:'')+(brand?' #'+brand:''));
  return L.join('\n');
}

/* ---------- 写真で今日の服を記録 ---------- */
async function outfitDataURL(file){
  const bmp=await loadBitmap(file);
  const w=bmp.width||bmp.naturalWidth, h=bmp.height||bmp.naturalHeight;
  const sc=Math.min(1,1024/Math.max(w,h));
  const cv=document.createElement('canvas'); cv.width=Math.round(w*sc); cv.height=Math.round(h*sc);
  cv.getContext('2d').drawImage(bmp,0,0,cv.width,cv.height);
  if(bmp.close) bmp.close();
  return cv.toDataURL('image/jpeg',0.8);
}
async function outfitIdentify(file){
  const mid=S._todayMem, m=memberOf(mid);
  const day=S.wearDate||today();
  const cands=S.items.filter(i=>isActive(i)&&i.memberId===mid);
  if(!cands.length){ toast(`${m?.name||''}さんの服がまだ登録されていません`); return }
  if(aiRemaining()<=0) return openLimit('ai');

  openSheet(`<div class="shead"><h3>写真から探しています</h3><button class="x" data-close>閉じる</button></div>
    <div class="empty"><span class="g">🔍</span><p>${esc(m.name)}さんの${cands.length}着の中から探しています…</p></div>`);
  const tok={}; S._outfitTok=tok;

  let image;
  try{ image=await outfitDataURL(file) }catch(e){ closeSheet(); toast('写真を読み込めませんでした'); return }
  try{
    const candidates=cands.map(i=>({
      id:i.id, category:catOf(i.category).n, color:i.color||'',
      size:i.size?sizeLabel(i.size):'',
      // Workerは brand 欄をそのまま候補の説明に使う。柄とキャラクター柄の有無を足して見分けやすくする
      brand:[i.pattern&&i.pattern!=='無地'?i.pattern:'', i.hasCharacterPrint?'キャラクター柄':'', i.brand||''].filter(Boolean).join(' ')
    }));
    const res=await fetch(API_BASE+'/identify',{
      method:'POST', headers:{'Content-Type':'application/json'},
      body:JSON.stringify({image,candidates})
    });
    const json=await res.json().catch(()=>null);
    if(!res.ok||!json?.ok) throw new Error(json?.error||('HTTP '+res.status));
    consumeAi();
    if(S._outfitTok!==tok) return;               // 待っている間に閉じられた
    const ids=new Set(cands.map(i=>i.id));
    // 40%未満は出さない（色違いなどの的外れな候補が並ぶため）。拾いたいときは「一覧から自分で選ぶ」
    const found=(json.result?.worn||[]).filter(w=>ids.has(w.id)&&(w.confidence||0)>=0.4)
      .sort((a,b)=>(b.confidence||0)-(a.confidence||0));
    S._outfit={day, mid, photo:image, found,
      unmatched:(json.result?.unmatched||[]).slice(0,4),
      pick:new Set(found.filter(w=>(w.confidence||0)>=0.7).map(w=>w.id))};
    renderOutfit();
  }catch(err){
    if(S._outfitTok===tok){ closeSheet(); toast('判別できませんでした') }
  }
}
function renderOutfit(){
  const o=S._outfit; if(!o) return;
  const m=memberOf(o.mid);
  const tile=(it,label)=>{
    const on=o.pick.has(it.id);
    return `<button class="tile ${on?'worn':''}" data-pick="${it.id}">
      <div class="ph" data-photo="${it.photoId||''}">${catOf(it.category).g}</div>
      ${on?'<span class="flag ok"></span>':''}${label?`<span class="tag">${label}</span>`:''}</button>`;
  };
  const done=it=>S.wears.some(x=>x.itemId===it.id&&x.date===o.day);

async function resizeTo(blob,max,q){
  const bmp=await loadBitmap(blob);
  const w=bmp.width||bmp.naturalWidth, h=bmp.height||bmp.naturalHeight;
  const sc=Math.min(1,max/Math.max(w,h));
  const cv=document.createElement('canvas'); cv.width=Math.round(w*sc); cv.height=Math.round(h*sc);
  const cx=cv.getContext('2d'); cx.imageSmoothingEnabled=true; cx.imageSmoothingQuality='high';
  cx.drawImage(bmp,0,0,cv.width,cv.height);
  if(bmp.close) bmp.close();
  return new Promise(r=>cv.toBlob(r,'image/jpeg',q));
}
/* 拡大用（長辺640px・約70KB）と小さい版（長辺240px・約10KB）を保存する */
async function saveOutfitPhoto(o){
  if(o.outfitId) return o.outfitId;
  const src=await (await fetch(o.photo)).blob();
  const id=uid();
  await dbPut('photos',{id,blob:await resizeTo(src,640,0.72)});
  await dbPut('thumbs',{id,blob:await resizeTo(src,240,0.7)});
  await dbPut('outfits',{id,memberId:o.mid,date:o.day,createdAt:Date.now(),big:true});
  o.outfitId=id;
  return id;
}
async function deleteOutfit(id){
  await dbDel('photos',id); await dbDel('thumbs',id); await dbDel('outfits',id);
  const u=urlCache.get(id); if(u){ URL.revokeObjectURL(u); urlCache.delete(id) }
}
/* 保存期間の整理。拡大用だけを消し、小さい版と記録は残す */
async function enforcePhotoRetention(){
  const all=await dbAll('outfits'); if(!all.length) return;
  const used=new Set(S.wears.map(w=>w.outfitId).filter(Boolean));
  const now=Date.now();
  for(const o of all){ if(!used.has(o.id) && now-o.createdAt>86400000) await deleteOutfit(o.id) }
  const keep=plan().photoKeep;
  const bigs=all.filter(o=>o.big&&used.has(o.id)).sort((a,b)=>b.createdAt-a.createdAt);
  const drop=keep.days ? bigs.filter(o=>now-o.createdAt>keep.days*86400000) : bigs.slice(keep.count);
  for(const o of drop){
    await dbDel('photos',o.id); o.big=false; await dbPut('outfits',o);
    const u=urlCache.get(o.id); if(u){ URL.revokeObjectURL(u); urlCache.delete(o.id) }
  }
  await reload();
}

  const small=big ? null : await thumbURL(oid);

/* まとめて記録。1着ずつ再描画しないよう、書き込んでから数え直す */
async function addWears(ids,date,outfitId=null){
  for(const id of ids){
    const ex=S.wears.find(w=>w.itemId===id&&w.date===date);
    if(ex){ if(outfitId&&!ex.outfitId){ ex.outfitId=outfitId; await dbPut('wears',ex) } continue }
    await dbPut('wears',{id:uid(),itemId:id,date,outfitId});
  }
  await reload();
  for(const id of ids){
    const it=S.items.find(i=>i.id===id); if(!it) continue;
    const ds=S.wears.filter(w=>w.itemId===id).map(w=>w.date).sort();
    it.wearCount=ds.length; it.lastWorn=ds.length?ds[ds.length-1]:null;
    await dbPut('items',it);
  }
  await enforcePhotoRetention();
  render();
}

/* 画面に近づいた写真だけ読み込む */
let photoIO=null;
function hydratePhotos(root){
  if(!root) return;
  const els=root.querySelectorAll('[data-photo]');
  if(!('IntersectionObserver' in window)){ els.forEach(loadThumbInto); return }
  if(!photoIO) photoIO=new IntersectionObserver(es=>{
    for(const e of es){ if(e.isIntersecting){ photoIO.unobserve(e.target); loadThumbInto(e.target) } }
  },{rootMargin:'400px 0px'});
  els.forEach(el=>{ if(el.getAttribute('data-photo')) photoIO.observe(el) });
}
async function loadThumbInto(el){
  const pid=el.getAttribute('data-photo'); if(!pid) return;
  const u=await thumbURL(pid);
  if(u&&el.isConnected){
    const st=el.getAttribute('style')||'';
    el.outerHTML=`<img src="${u}" alt="" decoding="async" style="${st}">`;
  }
}
/* 一覧を60枚ずつ描く。末尾に近づいたら次を足す */
const CHUNK=60;
const chunkIOs=new Map();   // ホームの一覧とシート内の一覧が互いに止め合わないよう、名前ごとに持つ
function stopChunk(key){ const ob=chunkIOs.get(key); if(ob){ ob.disconnect(); chunkIOs.delete(key) } }
function chunkGrid(container,list,tileFn,key='main'){
  stopChunk(key);
  container.innerHTML='';
  let i=0;
  const sentinel=document.createElement('div');
  sentinel.style.cssText='grid-column:1/-1;height:1px';
  container.appendChild(sentinel);
  const add=()=>{
    const tmp=document.createElement('div');
    tmp.innerHTML=list.slice(i,i+CHUNK).map(tileFn).join('');
    while(tmp.firstChild) container.insertBefore(tmp.firstChild,sentinel);
    i+=CHUNK;
    hydratePhotos(container);
    if(i>=list.length){ stopChunk(key); sentinel.remove() }
  };
  add();
  if(i<list.length){
    if('IntersectionObserver' in window){
      const ob=new IntersectionObserver(es=>{ if(es.some(e=>e.isIntersecting)) add() },{rootMargin:'800px 0px'});
      chunkIOs.set(key,ob); ob.observe(sentinel);
    }else{ while(i<list.length) add() }
  }
}

/* 前後の服の写真を先に読み込んで展開しておく。スワイプした瞬間に写真が白く抜けないように */
const warmed=new Map();
function warmPhoto(photoId){
  if(!photoId) return Promise.resolve();
  if(warmed.has(photoId)) return warmed.get(photoId).p;
  const p=photoURL(photoId).then(u=>{
    if(!u) return;
    const im=new Image(); im.src=u;
    const rec=warmed.get(photoId); if(rec) rec.im=im;  // 展開済みの画像を手放さないよう持っておく
    return im.decode ? im.decode().catch(()=>{}) : null;
  });
  warmed.set(photoId,{p,im:null});
  while(warmed.size>4) warmed.delete(warmed.keys().next().value);
  return p;
}
function warmNeighbors(){
  const nav=S._nav||[], i=nav.indexOf(S._openItemId); if(i<0) return;
  [nav[i+1],nav[i-1]].forEach(id=>{ const x=S.items.find(v=>v.id===id); if(x) warmPhoto(x.photoId) });
}
/* 前後の服へ。一覧で見えていた順番のとおりに進む */
function stepItem(dir){
  const nav=S._nav||[], i=nav.indexOf(S._openItemId);
  if(i<0) return false;
  const j=i+dir;
  if(j<0||j>=nav.length){ toast(dir>0?'これが最後の服です':'これが最初の服です'); return false }
  if(S._stepping) return true;
  S._stepping=true;
  const inner=$('#sheet-inner'), w=inner.offsetWidth||360;
  const next=S.items.find(v=>v.id===nav[j]);
  const ready=warmPhoto(next&&next.photoId);         // 画面が動いている間に次の写真を用意する
  inner.style.transition='transform .12s ease-in';
  inner.style.transform=`translateX(${dir>0?-w:w}px)`;
  const slid=new Promise(r=>setTimeout(r,120));
  const capped=Promise.race([ready,new Promise(r=>setTimeout(r,300))]);
  Promise.all([slid,capped]).then(async()=>{
    try{ await openItem(nav[j]) }catch(e){}
    $('#sheet').scrollTop=0;
    inner.style.transition='none';
    inner.style.transform=`translateX(${dir>0?w*0.3:-w*0.3}px)`;
    requestAnimationFrame(()=>requestAnimationFrame(()=>{
      inner.style.transition='transform .16s ease-out'; inner.style.transform='';
      setTimeout(()=>{ inner.style.transition=''; S._stepping=false },180);
    }));
  });
  if(!S.settings.swiped){ S.settings.swiped=true; saveSettings() }
  return true;
}

async function wearItem(id,date=today()){
  const it=S.items.find(i=>i.id===id); if(!it) return;
  const exist=S.wears.find(w=>w.itemId===id&&w.date===date);
  if(exist){
    await dbDel('wears',exist.id);
    if(exist.outfitId && !S.wears.some(w=>w.id!==exist.id&&w.outfitId===exist.outfitId)) await deleteOutfit(exist.outfitId);
  }
  else await dbPut('wears',{id:uid(),itemId:id,date});
  // 回数と最終着用日は、記録そのものから数え直す。過去の日付を足しても順序が崩れない
  const dates=S.wears.filter(w=>w.itemId===id&&w.id!==exist?.id).map(w=>w.date);
  if(!exist) dates.push(date);
  dates.sort();
  it.wearCount=dates.length;
  it.lastWorn=dates.length?dates[dates.length-1]:null;
  await dbPut('items',it);
  toast(exist?'記録を取り消しました':(date===today()?'今日着た服に記録しました':`${fmtMD(date)}に着た服として記録しました`));
  await reload(); render();
}

    for(const m of (d.members||[])) await dbPut('members',m);

/* 解析用に小さく作り直す。900pxのまま送ると画像トークンが3倍かかる */
async function analysisDataURL(blob){
  const bmp=await loadBitmap(blob);
  const s=512;
  const cv=document.createElement('canvas'); cv.width=s; cv.height=s;
  cv.getContext('2d').drawImage(bmp,0,0,s,s);
  if(bmp.close) bmp.close();
  return cv.toDataURL('image/jpeg',0.8);
}

function applyAnalysis(r){
  const d=S.draft||{};
  const patch={aiDone:true};
  if(r.category && CATS.some(c=>c.id===r.category)) patch.category=r.category;
  if(r.color && COLORS.some(c=>c.n===r.color)){ patch.color=r.color; patch.autoColor=true }
  if(Array.isArray(r.season)){
    const ss=r.season.filter(s=>SEASONS.includes(s));
    if(ss.length) patch.season=ss;
  }
  patch.pattern = r.pattern || null;
  patch.hasCharacterPrint = !!r.hasCharacterPrint;
  patch.aiConfidence = typeof r.confidence==='number' ? r.confidence : null;
  S.draft={...d,...patch};
}

async function aiAnalyze(){
  const d=S.draft;
  if(!d?.blob){ toast('先に写真を撮ってください'); return }

  const base=API_BASE;

  if(aiRemaining()<=0){
    toast('今月のAI判別を使い切りました');
    S.draft={...d,aiError:'limit'}; renderAdd(); return;
  }

  S.draft={...d,aiBusy:true,aiError:null}; renderAdd();
  try{
    const image=await analysisDataURL(d.blob);
    const res=await fetch(base+'/analyze',{
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body:JSON.stringify({image})
    });
    const json=await res.json().catch(()=>null);
    if(!res.ok||!json?.ok) throw new Error(json?.error||('HTTP '+res.status));

    // 成功したときだけ回数を消費する
    consumeAi();

    S.draft={...S.draft,aiBusy:false};
    applyAnalysis(json.result);
    renderAdd();
    toast('AIが判別しました');
  }catch(err){
    S.draft={...S.draft,aiBusy:false,aiError:String(err.message||err)};
    renderAdd();
    toast('判別できませんでした');
  }
}

function batchChrome(){

function batchRefresh(it){

  const row=$('#br-'+it.k);
  if(row && !row.contains(document.activeElement)){
    row.outerHTML=batchRow(it,memberOf(S.batch.mid));

async function addBatchPhoto(src){
  const b=S.batch; if(!b) return;
  try{
    const {blob,color}=await processPhoto(src);
    const sig=await photoSig(blob), feat=await photoFeat(blob);
    b.list.push({k:uid(),blob,sig,feat,dupDismissed:[],url:URL.createObjectURL(blob),color:color||null,
      ...(b.size!=null?{size:b.size,sizeAuto:true}:{}),
      st:S.settings.aiMode!=='off'?'wait':'skip'});
  }catch(e){ toast('読み込めない写真がありました'); return }
  if(S.batch===b && S.view==='add') renderBatch();
  pumpBatchAi();
}
/* 順番待ちの服を、同時に BATCH_PARALLEL 着ずつAIに送る */
function pumpBatchAi(){
  const b=S.batch; if(!b) return;
  while(b.running<BATCH_PARALLEL){
    const it=b.list.find(i=>i.st==='wait'); if(!it) break;
    if(aiRemaining()-b.running<=0){        // 回数は成功したときに減るので、送信中の分を差し引いて見る
      b.list.forEach(i=>{ if(i.st==='wait') i.st='skip' });
      if(S.view==='add') renderBatch();
      break;
    }
    it.st='busy'; b.running++;
    batchRefresh(it);
    batchAnalyze(it).finally(()=>{ b.running--; if(S.batch===b){ batchRefresh(it); pumpBatchAi() } });
  }
}
async function batchAnalyze(it){
  try{
    const image=await analysisDataURL(it.blob);
    const ctl=new AbortController(), tm=setTimeout(()=>ctl.abort(),45000);
    const res=await fetch(API_BASE+'/analyze',{method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({image}),signal:ctl.signal}).finally(()=>clearTimeout(tm));
    const json=await res.json().catch(()=>null);
    if(!res.ok||!json?.ok) throw new Error(json?.error||('HTTP '+res.status));
    consumeAi();
    const r=json.result||{};
    if(!it.touchedCat && r.category && CATS.some(c=>c.id===r.category)) it.category=r.category;
    if(it.sizeAuto && it.category==='shoes'){ delete it.size; it.sizeAuto=false }   // くつは服のサイズと単位が違う
    if(r.color && COLORS.some(c=>c.n===r.color)) it.color=r.color;
    if(Array.isArray(r.season)) it.season=r.season.filter(s=>SEASONS.includes(s));
    it.pattern=r.pattern||null; it.hasCharacterPrint=!!r.hasCharacterPrint;
    it.st='ok';
  }catch(e){ it.st='err' }
}
async function saveBatch(){
  const b=S.batch; if(!b||!b.list.length) return;
  if(b.list.some(i=>i.st==='busy'||i.st==='wait')){ toast('AIの判別が終わるまでお待ちください'); return }
  const miss=b.list.filter(i=>!i.category);
  if(miss.length){
    toast(`カテゴリが決まっていない服が${miss.length}着あります`);
    $('#br-'+miss[0].k)?.scrollIntoView({block:'center',behavior:'smooth'});
    return;
  }
  const room=plan().items-countItems();
  if(room<=0) return openLimit('items');
  const m=memberOf(b.mid), take=b.list.slice(0,room);
  const btn=$('#batch-save'); if(btn){ btn.disabled=true; btn.textContent='登録しています…' }
  const idOf=new Map(take.map(it=>[it.k,uid()]));
  for(const it of take){

/* ---- 診断結果。まとめて登録のあとに、その人の服を「もう小さい／もうすぐ／まだ着られる」に分けて見せる ---- */
function diagnose(m){
  const items=S.items.filter(i=>isActive(i)&&i.memberId===m.id);
  const out=[], soon=[], ok=[], nosize=[], hand=[];
  for(const it of items){
    const s=sizeNum(it.size);
    if(s===null){ nosize.push(it); continue }
    if(isOutgrown(it)){ out.push(it); const to=handDownTarget(it); if(to) hand.push({it,to}); continue }
    const mo=monthsLeft(m,s);
    if(mo!==null&&mo<=3) soon.push(it); else ok.push(it);
  }
  return {items,out,soon,ok,nosize,hand};
}

/* 2着を1着にまとめる。先に登録した方を残し、着た記録・空いている項目・枚数を移す */
async function mergeItems(a,b,addQty){
  const [keep,drop]=String(a.id)<String(b.id)?[a,b]:[b,a];
  for(const w of S.wears.filter(w=>w.itemId===drop.id)){
    if(S.wears.some(x=>x.itemId===keep.id&&x.date===w.date)) await dbDel('wears',w.id);
    else{ w.itemId=keep.id; await dbPut('wears',w) }
  }
  await reload();
  const k=S.items.find(i=>i.id===keep.id);
  const dates=S.wears.filter(w=>w.itemId===k.id).map(w=>w.date).sort();
  k.wearCount=dates.length; k.lastWorn=dates.length?dates[dates.length-1]:null;
  if(addQty) k.qty=(k.qty||1)+(drop.qty||1);
  for(const f of ['brand','price','purchaseDate','buyBucket','color','pattern']) if(k[f]==null&&drop[f]!=null) k[f]=drop[f];
  if(!k.photoId&&drop.photoId){ k.photoId=drop.photoId; k.sig=drop.sig; k.feat=drop.feat }
  else if(drop.photoId&&drop.photoId!==k.photoId){ await dbDel('photos',drop.photoId); await dbDel('thumbs',drop.photoId) }
  k.notDup=[...new Set([...(k.notDup||[]),...(drop.notDup||[])])];
  await dbPut('items',k); await dbDel('items',drop.id);
  await reload();
  return k;
}

let camStream=null;

async function openCamera(batch=false){
  const pick=batch?'#batch-file':'#shot';
  if(!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia){ $(pick).click(); return }
  try{
    camStream=await navigator.mediaDevices.getUserMedia({
      video:{facingMode:{ideal:'environment'},width:{ideal:1600},height:{ideal:1600}},
      audio:false});
  }catch(e){
    toast('カメラを使えないので写真から選びます');

  }
  S._camBatch=batch;
  $('#cam-close').textContent=batch?'完了':'閉じる';
  camCount();
  const v=$('#cam-video');
  v.srcObject=camStream;
  $('#cam').classList.add('on');
  try{ await v.play() }catch(e){}
}
function closeCamera(){
  if(camStream){ camStream.getTracks().forEach(t=>t.stop()); camStream=null }
  const v=$('#cam-video'); if(v) v.srcObject=null;
  $('#cam').classList.remove('on');
  if(S._camBatch){ S._camBatch=false; camCount(); if(S.view==='add') renderAdd() }

function camCount(){
  const el=$('#cam-count'); if(!el) return;
  const n=S._camBatch&&S.batch ? S.batch.list.length+(S.batch.shooting||0) : 0;
  el.hidden=!S._camBatch;
  const sz=S.batch?.size!=null?`${sizeLabel(S.batch.size)}サイズ・`:'';
  const hint=S.batch?.size!=null?sizeHint(memberOf(S.batch.mid),S.batch.size):'';
  el.innerHTML=esc(n?`📚 ${sz}${n}着 撮りました。次の服に置きかえてどうぞ`:`📚 ${sz}1着ずつ続けて撮れます`)
    +(hint?`<br><span class="cam-hint">📏 ${esc(hint)}</span>`:'');

async function shootCamera(){
  const v=$('#cam-video');
  const vw=v.videoWidth, vh=v.videoHeight;
  if(!vw||!vh){ toast('もう一度お試しください'); return }
  const s=Math.round(Math.min(vw,vh)*0.92);          // ガイド枠にあたる中央の正方形
  const cv=document.createElement('canvas'); cv.width=s; cv.height=s;
  cv.getContext('2d').drawImage(v,(vw-s)/2,(vh-s)/2,s,s,0,0,s,s);
  if(S._camBatch){                                    // 閉じずに次を撮れるようにする
    const st=$('.cam-stage'); st.classList.remove('flash'); void st.offsetWidth; st.classList.add('flash');
    S.batch.shooting=(S.batch.shooting||0)+1; camCount();
    await addBatchPhoto(cv);
    S.batch&&(S.batch.shooting--); camCount();
    return;
  }
  closeCamera();
  await acceptPhoto(cv);
}
