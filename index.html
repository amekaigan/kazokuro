    const a=S.items.find(i=>i.id===aid), b=S.items.find(i=>i.id===bid);
    if(!a||!b) return openDupReview();
    if(act==='diff'){ a.notDup=[...new Set([...(a.notDup||[]),b.id])]; await dbPut('items',a); await reload() }
    else{ const k=await mergeItems(a,b,act==='more'); toast(act==='more'?`1つにまとめて${k.qty}枚にしました`:'1つにまとめました') }
    render();
    return openDupReview();
  }
  if(t.id==='batch-cam') return openCamera(true);
  if(t.id==='batch-pick') return $('#batch-file').click();
  if(t.id==='batch-save') return saveBatch();
  if(t.id==='batch-cancel') return cancelBatch();

  if(g('data-wear'))  return wearItem(g('data-wear'), S.wearDate||today());
  if(g('data-wear2')){ const id=g('data-wear2'); await wearItem(id); return openItem(id) }
  if(g('data-unwear')){
    const [id,dt]=g('data-unwear').split('|');
    await wearItem(id,dt); return openItem(id);
  }
  if(g('data-item')){ S._nav=navListFrom(t); return openItem(g('data-item')) }
  if(g('data-step')) return stepItem(Number(g('data-step')));
  if(g('data-member'))return openMemberForm(g('data-member'));
  if(t.id==='add-member') return canAddMember() ? openMemberForm(null) : openLimit('members');

  /* --- 登録フォーム --- */
  if(g('data-dmem')){ syncAdd(); S.draft={...(S.draft||{}),memberId:g('data-dmem'),size:undefined}; return renderAdd() }
  if(g('data-dcat')){
    syncAdd();
    const nc=g('data-dcat'), pc=S.draft?.category??S.lastUsed.category;
    const flip=(nc==='shoes')!==(pc==='shoes');
    if(flip&&S._sizeMore) delete S._sizeMore['d-size'];
    S.draft={...(S.draft||{}),category:nc,...(flip?{size:undefined}:{})};
    return renderAdd();
  }
  if(g('data-dsize')){ syncAdd(); S.draft={...(S.draft||{}),size:g('data-dsize')}; return renderAdd() }
  if(g('data-dcolor')){ syncAdd(); S.draft={...(S.draft||{}),color:g('data-dcolor'),autoColor:false}; return renderAdd() }
  if(g('data-dseason')){
    syncAdd();
    const s=g('data-dseason'); const cur=new Set(S.draft?.season||[]);
    cur.has(s)?cur.delete(s):cur.add(s);
    S.draft={...(S.draft||{}),season:[...cur]}; return renderAdd();
  }
  if(t.id==='shot-label'||t.id==='shot-redo') return openCamera();
  if(t.id==='cam-pick' && S._camBatch){ closeCamera(); return $('#batch-file').click() }
  if(t.id==='shot-pick'||t.id==='cam-pick'){ closeCamera(); return $('#shot').click() }
  if(t.id==='cam-close') return closeCamera();
  if(t.id==='cam-shoot') return shootCamera();
  if(t.id==='ai-run') return aiAnalyze();
  if(t.id==='outfit-shot') return $('#outfit-file').click();
  if(t.hasAttribute('data-tcat')){ S._todayCat=g('data-tcat')||null; return drawTodayGrid() }
  if(g('data-wphoto')) return openWearPhoto(g('data-wphoto'));
  if(g('data-wearon')){
    const x=S._iwd; if(!x||x.id!==g('data-wearon')) return;
    await wearItem(x.id,x.date); S._iwd=null; return openItem(x.id);
  }
  if(g('data-fontscale')){ S.settings.fontScale=g('data-fontscale'); saveSettings(); applyFontScale(); return renderSet() }
  if(g('data-outfitmode')){ if(S._outfit){ S._outfit.mode=g('data-outfitmode'); S._outfit.cat=null } return renderOutfit() }
  if(t.hasAttribute('data-ocat')){ if(S._outfit) S._outfit.cat=g('data-ocat')||null; return renderOutfit() }
  if(t.hasAttribute('data-oreg')){
    const o=S._outfit; if(!o) return;
    if(!canAddItem()){ closeSheet(); return openLimit('items') }
    const idx=g('data-oreg'), hint=idx!==''?(o.unmatched[Number(idx)]||''):'';
    const n=o.pick.size;
    const oid=await saveOutfitPhoto(o);
    if(n) await addWears([...o.pick], o.day, oid);   // 選んでいた服は先に記録しておく
    S._outfit=null; closeSheet();
    if(S.draft?.photoURL) URL.revokeObjectURL(S.draft.photoURL);
    S.draft={memberId:o.mid, wearOn:{date:o.day,outfitId:oid}, outfitSrc:o.photo, hint};
    go('add');
    toast(n?`${n}着を記録しました。続けて新しい服を登録します`:'新しい服を登録します');
    return;
  }
  if(t.id==='use-outfit'){
    const src=S.draft?.outfitSrc; if(!src) return;
    return acceptPhoto(await (await fetch(src)).blob());
  }
  if(t.id==='cancel-wearon'){ S.draft={...S.draft,wearOn:null,outfitSrc:null,hint:''}; return renderAdd() }
  if(g('data-pick')){
    const id=g('data-pick'), pk=S._outfit?.pick; if(!pk) return;
    pk.has(id)?pk.delete(id):pk.add(id);
    return renderOutfit();
  }
  if(t.hasAttribute('data-outfitsave')){
    const o=S._outfit; if(!o||!o.pick.size) return;
    const n=o.pick.size;
    const oid=await saveOutfitPhoto(o);
    await addWears([...o.pick], o.day, oid);
    S._outfit=null; closeSheet();
    toast(`${n}着を記録しました`);
    return;
  }
  if(g('data-aimode')){
    S.settings.aiMode=g('data-aimode'); saveSettings(); renderSet(); return;
  }
  if(g('data-plan')){
    S.settings.plan=g('data-plan'); saveSettings();
    await enforcePhotoRetention(); renderSet();
    toast(plan().name+'プランに切り替えました（テスト）'); return;
  }
  if(t.id==='add-pack'){
    S.packs.push({id:uid(),remaining:PACK_SIZE,expires:Date.now()+PACK_DAYS*86400000});
    savePacks(); renderSet(); toast('回数パックを追加しました（テスト）'); return;
  }
  if(g('data-limit')) return openLimit(g('data-limit'));
  if(t.id==='save-api'){
    try{
      const r=await fetch(API_BASE+'/health');
      const j=await r.json();
      toast(j?.ok?'接続できました':'応答が想定と違います');
    }catch(e){ toast('つながりませんでした') }
    return;
  }
  if(g('data-finish')){
    S.settings.finish=g('data-finish'); saveSettings(); renderSet();
    toast({strong:'しっかり整えます',soft:'ひかえめに整えます',off:'撮ったままを使います'}[S.settings.finish]);
    return;
  }
  if(t.id==='save-next') return saveDraft(true);
  if(t.id==='save-done') return saveDraft(false);

  /* --- 家族フォーム --- */
  if(g('data-msize')){
    S._msize=g('data-msize');
    $('#m-size').querySelectorAll('[data-msize]').forEach(b=>
      b.setAttribute('aria-pressed', b.getAttribute('data-msize')===S._msize));
    return;
  }
  if(g('data-mcolor')){
    S._mcolor=g('data-mcolor');
    $('#m-color').querySelectorAll('[data-mcolor]').forEach(b=>
      b.setAttribute('aria-pressed', b.getAttribute('data-mcolor')===S._mcolor));
    return;
  }
  if(g('data-savemember')!==null&&t.hasAttribute('data-savemember')){
    const id=g('data-savemember')||uid();
    const name=($('#m-name').value||'').trim();
    if(!name){ toast('名前を入れてください'); return }
    const exist=memberOf(id);
    if(!exist && !canAddMember()){ closeSheet(); return openLimit('members') }
    // 子どもは身長がないと診断できないので、1つも記録がなければ入れてもらう
    const bd=$('#m-bd').value||null, hv0=parseFloat($('#m-height')?.value);
    const kidByBd=bd && avgHeightFor(bd)!==null;
    if(kidByBd && !Number.isFinite(hv0) && !heightsOf(id).length){
      toast('子どもは身長を入れてください。分からなければ「年齢の平均を入れる」を押してください');
      $('#m-height')?.focus(); return;
    }
    await dbPut('members',{id,name,birthday:bd,
      currentSize:S._msize||exist?.currentSize||null,
      color:S._mcolor||exist?.color||MEMBER_COLORS[S.members.length%MEMBER_COLORS.length].n,
      order:exist?.order??S.members.length});
    const hv=parseFloat($('#m-height')?.value);
    const hd=$('#m-hdate')?.value||today();
    if(Number.isFinite(hv)&&hv>=40&&hv<=210){
      const dup=S.growth.find(x=>x.memberId===id&&x.date===hd);
      if(dup) await dbDel('growth',dup.id);
      const est=S._hEst===hv;            // 「年齢の平均」で入れた値のまま保存したとき
      await dbPut('growth',{id:uid(),memberId:id,date:hd,height:Math.round(hv*10)/10,...(est?{est:true}:{})});
    }
    S._hEst=null;
    await reload(); closeSheet(); render(); toast('保存しました');
    return;
  }
  if(t.hasAttribute('data-hest')){
    const v=avgHeightFor($('#m-bd')?.value, $('#m-hdate')?.value);
    if(v===null){ toast('先に生年月日を入れてください（15歳まで）'); return $('#m-bd')?.focus() }
    $('#m-height').value=v; S._hEst=v;
    toast(`年齢の平均 ${v}cm を入れました。測ったらあとで直してください`); return;
  }
  if(g('data-delheight')){
    await dbDel('growth',g('data-delheight'));
    await reload(); openMemberForm(S._mopen); render();
    return;
  }
  if(g('data-delmember')){
    if(!confirm('この家族と、その服の持ち主情報が消えます。よろしいですか？')) return;
    await dbDel('members',g('data-delmember'));
    await reload(); closeSheet(); render(); toast('削除しました');
    return;
  }

  /* --- 編集フォーム --- */
  if(g('data-emem')||g('data-ecat')||g('data-esize')||g('data-ecolor')||g('data-eseason')){
    const grp=g('data-emem')?'e-mem':g('data-ecat')?'e-cat':g('data-esize')?'e-size':g('data-ecolor')?'e-color':'e-season';
    if(grp==='e-season'){
      const cur=new Set(S._edit.season||[]); const v=g('data-eseason');
      cur.has(v)?cur.delete(v):cur.add(v); S._edit.season=[...cur];
      t.setAttribute('aria-pressed',cur.has(v));
    }else{
      const key={'e-mem':'memberId','e-cat':'category','e-size':'size','e-color':'color'}[grp];
      const attr={'e-mem':'data-emem','e-cat':'data-ecat','e-size':'data-esize','e-color':'data-ecolor'}[grp];
      const prevCat=S._edit.category;
      S._edit[key]=t.getAttribute(attr);
      document.querySelectorAll('#sheet-inner ['+attr+']').forEach(b=>
        b.setAttribute('aria-pressed', b.getAttribute(attr)===S._edit[key]));
      if(grp==='e-cat' && (prevCat==='shoes')!==(S._edit.category==='shoes')){
        S._edit.size='';
        if(S._sizeMore) delete S._sizeMore['e-size'];
        const mem=memberOf(S._edit.memberId), w=$('#e-size-wrap');
        if(w) w.innerHTML=sizeChips('e-size','data-esize','',isKidMember(mem),S._edit.category,mem);
      }
    }
    return;
  }
  if(g('data-saveedit')){
    const it=S.items.find(i=>i.id===g('data-saveedit')); if(!it) return;
    Object.assign(it,{
      memberId:S._edit.memberId, category:S._edit.category,
      size:S._edit.size, color:S._edit.color, season:S._edit.season,
      brand:($('#e-brand').value||'').trim()||null,
      price:$('#e-price').value?Number($('#e-price').value):null,
      ...(()=>{
        const v=$('#e-pdate').value;
        if(v) return {purchaseDate:v,purchaseApprox:false,buyBucket:null};
        const b=BUY_BUCKETS.find(x=>x[0]===S._edit.buyBucket);
        // 同じ区分のままなら元の日付を残す。そうしないと保存のたびに経過が巻き戻る
        if(b) return {purchaseDate:(it.purchaseApprox&&it.buyBucket===b[0]&&it.purchaseDate)?it.purchaseDate:monthsAgo(b[2]),purchaseApprox:true,buyBucket:b[0]};
        return {purchaseDate:null,purchaseApprox:false,buyBucket:null};
      })()
    });
    await dbPut('items',it); await reload(); closeSheet(); render(); toast('保存しました');
    return;
  }

  /* --- 詳細アクション --- */
  if(g('data-listing')) return openListing(g('data-listing'));
  if(g('data-edit'))    return openEdit(g('data-edit'));
  if(t.id==='copy-listing'){
    const ta=$('#lt');
    try{ await navigator.clipboard.writeText(ta.value); toast('コピーしました') }
    catch(err){ ta.select(); document.execCommand('copy'); toast('コピーしました') }
    return;
  }
  if(g('data-handdown')){
    const it=S.items.find(i=>i.id===g('data-handdown')); const to=handDownTarget(it);
    if(!it||!to) return;
    it.memberId=to.id; it.handedDown=true;
    await dbPut('items',it); await reload(); closeSheet(); render();
    toast(to.name+'さんへ移しました');
    return;
  }
  if(g('data-status')){
    const [id,st]=g('data-status').split('|');
    const it=S.items.find(i=>i.id===id); if(!it) return;
    it.status=st; await dbPut('items',it); await reload(); closeSheet(); render();
    toast(st==='sold'?'売却済みにしました':st==='listed'?'出品中にしました':'戻しました');
    return;
  }
  if(g('data-del')){
    if(!confirm('この服を削除します。よろしいですか？')) return;
    const it=S.items.find(i=>i.id===g('data-del'));
    if(it?.photoId){ await dbDel('photos',it.photoId); await dbDel('thumbs',it.photoId) }
    await dbDel('items',g('data-del'));
    await reload(); closeSheet(); render(); toast('削除しました');
    return;
  }

  /* --- 設定 --- */
  if(t.id==='exp-meta') return exportData(false);
  if(t.id==='exp-full') return exportData(true);
  if(t.id==='imp')      return $('#impfile').click();
});

$('#scrim').addEventListener('click',closeSheet);

function applyPendingWearDate(){
  const v=S._pendingWearDate; if(!v) return;
  S._pendingWearDate=null;
  S.wearDate = v===today()?null:v;
  renderToday();
}
document.addEventListener('focusout',e=>{ if(e.target&&e.target.id==='wear-date') applyPendingWearDate() });

/* シートの操作：下に引いて閉じる（一番上までスクロールしているときだけ）・詳細は左右で前後の服へ */
(function sheetGestures(){
  const sh=$('#sheet'), inner=$('#sheet-inner');
  let st=null;
  const noX=el=>!!el.closest('.filters,.tablewrap,input,textarea,select');
  sh.addEventListener('touchstart',e=>{
    if(e.touches.length!==1){ st=null; return }
    const t=e.touches[0];
    st={x:t.clientX,y:t.clientY,t:Date.now(),top:sh.scrollTop<=0,noX:noX(e.target),dir:null};
  },{passive:true});
  sh.addEventListener('touchmove',e=>{
    if(!st) return;
    const t=e.touches[0], dx=t.clientX-st.x, dy=t.clientY-st.y;
    if(!st.dir && (Math.abs(dx)>12||Math.abs(dy)>12)) st.dir = Math.abs(dx)>Math.abs(dy)*1.3 ? 'x' : 'y';
    if(st.dir==='y' && st.top && dy>0){ sh.style.transform=`translateY(${dy*0.6}px)`; e.preventDefault() }
    if(st.dir==='x' && !st.noX && S._openItemId){
      inner.style.transform=`translateX(${dx}px)`;       // 指に吸いつかせる
    }
  },{passive:false});
  sh.addEventListener('touchend',e=>{
    if(!st) return;
    const t=e.changedTouches[0], dx=t.clientX-st.x, dy=t.clientY-st.y, dt=Date.now()-st.t;
    const s0=st; st=null;
    if(s0.dir==='y' && s0.top && dy>90){ closeSheet(); return }
    if(s0.dir==='x' && !s0.noX && S._openItemId && (Math.abs(dx)>60 || (Math.abs(dx)>30&&dt<300))){
      if(stepItem(dx<0?1:-1)) return;
    }
    sh.style.transition='transform .18s'; sh.style.transform='';
    inner.style.transition='transform .18s, opacity .18s'; inner.style.transform=''; inner.style.opacity='';
    setTimeout(()=>{ sh.style.transition=''; inner.style.transition='' },200);
  });
})();
document.addEventListener('keydown',e=>{
  if(!$('#sheet').classList.contains('on')) return;
  if(e.target.closest&&e.target.closest('input,textarea,select')) return;
  if(e.key==='Escape') closeSheet();
  if(S._openItemId && e.key==='ArrowRight') stepItem(1);
  if(S._openItemId && e.key==='ArrowLeft')  stepItem(-1);
});

/* 文字の大きさ */
const FONT_SCALES={small:['小さめ',0.9],normal:['ふつう',1],large:['大きめ',1.2]};
function applyFontScale(){
  const k=FONT_SCALES[S.settings.fontScale]?S.settings.fontScale:'normal';
  document.documentElement.style.setProperty('--fs', FONT_SCALES[k][1]);
}
applyFontScale();

document.addEventListener('change',async e=>{
  if(e.target.id==='batch-file'){
    const fs=[...(e.target.files||[])]; e.target.value='';
    if(!fs.length||!S.batch) return;
    toast(`${fs.length}枚を読み込んでいます…`);
    for(const f of fs) await addBatchPhoto(f);     // 1枚ずつ処理して、端末のメモリを使いすぎない
    return;
  }
  if(e.target.hasAttribute('data-bk')){
    const it=S.batch?.list.find(i=>i.k===e.target.getAttribute('data-bk')); if(!it) return;
    const v=e.target.value;
    if(e.target.getAttribute('data-bf')==='category'){ it.category=v||null; it.touchedCat=true }
    else{ it.size=v; it.sizeAuto=false }
    e.target.blur();
    batchRefresh(it);
    return;
  }
  if(e.target.id==='outfit-file'){
    const f=e.target.files?.[0]; e.target.value='';
    if(f) await outfitIdentify(f);
    return;
  }
  if(e.target.id==='closet-sort'){
    S.settings.closetSort=e.target.value; saveSettings(); renderCloset(); return;
  }
  // 日付を選んでいる最中に画面を描き直すと、日付の選択そのものが閉じてしまう。
  // iPhoneはダイヤルを回すたびに値が変わるので、ここでは表示だけ直して、確定は別にする
  if(e.target.id==='item-wear-date'){
    const v=e.target.value, id=e.target.getAttribute('data-for');
    const box=$('#iwd-confirm'), lab=$('#iwd-label');
    if(!v||v>today()){ if(box) box.hidden=true; return }
    S._iwd={id,date:v};
    if(lab) lab.textContent='📅 '+fmtMD(v).replace(/（.）/,'');
    if(box){
      const b=box.querySelector('button'), done=S.wears.some(w=>w.itemId===id&&w.date===v);
      b.textContent = done ? fmtMD(v)+'は記録済みです' : fmtMD(v)+'に着たと記録する';
      b.disabled = done; box.hidden=false;
    }
    return;
  }
  if(e.target.id==='wear-date'){
    const v=e.target.value;
    if(!v||v>today()) return;
    S._pendingWearDate=v;
    const lab=$('#wd-label'); if(lab) lab.textContent='📅 '+fmtMD(v).replace(/（.）/,'');
    if(!matchMedia('(pointer:coarse)').matches) applyPendingWearDate();   // パソコンはその場で反映。スマホは閉じたときに反映
    return;
  }
  if(e.target.id==='d-pdate'){
    syncAdd();
    if(e.target.value) document.querySelectorAll('[data-dbuy]').forEach(b=>b.setAttribute('aria-pressed','false'));
    return;
  }
  if(e.target.id==='e-pdate' && e.target.value){
    S._edit.buyBucket=null;
    document.querySelectorAll('#sheet-inner [data-ebuy]').forEach(b=>b.setAttribute('aria-pressed','false'));
    return;
  }
  if(e.target.id==='shot'){
    const f=e.target.files?.[0];
    e.target.value='';
    if(f) await acceptPhoto(f);
    return;
  }
  if(e.target.id==='impfile'){
    const f=e.target.files?.[0]; if(f) await importData(f);
    e.target.value='';
  }
});

/* ============================================================
   起動
   ============================================================ */
(async function init(){
  try{
    await openDB();
    await reload();
    const fixed=await repairPhotoLinks();
    await requestPersist();
    await enforcePhotoRetention();
    const ver=$('#ver'); if(ver) ver.textContent='v'+APP_VERSION;
    go('today');
    if(!S.members.length && !S.settings.introSeen) openIntro();
    backfillHashes();
    if(fixed) setTimeout(()=>toast(fixed+'着の写真を復旧しました'),600);
  }catch(e){
    document.getElementById('app').innerHTML=
      '<div class="empty"><span class="g">⚠️</span><p>データベースを開けませんでした。<br>プライベートブラウズを解除して、もう一度開いてください。</p></div>';
  }
})();
</script>
