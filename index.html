<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#E8ECEE">
<title>家族ローゼット（かぞクロ）</title>
<meta name="apple-mobile-web-app-title" content="かぞクロ">
<style>
:root{
  --bg:#E8ECEE; --surface:#FFFFFF; --surface2:#F3F6F7;
  --ink:#16323B; --ink2:#5C7480; --ink3:#8CA0A8;
  --line:#D5DDE0; --line2:#E6ECEE;
  --indigo:#24557A; --indigo-d:#1A4160; --indigo-bg:#E4EDF4;
  --amber:#A96E12; --amber-bg:#FAF0DC;
  --ok:#35705A; --ok-bg:#E4F0EA;
  --danger:#9B3B33;
  --r:14px; --r-s:9px;
  --safe-t:env(safe-area-inset-top,0px);
  --safe-b:env(safe-area-inset-bottom,0px);
  --nav-h:66px;
  box-sizing:border-box;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#101A1E; --surface:#182529; --surface2:#1F2E33;
    --ink:#E4EDEF; --ink2:#9AB0B8; --ink3:#6E858D;
    --line:#2A3B41; --line2:#223237;
    --indigo:#7FB0D6; --indigo-d:#A3C8E5; --indigo-bg:#1C3243;
    --amber:#D9A74E; --amber-bg:#33291A;
    --ok:#6FB294; --ok-bg:#1B2F28;
    --danger:#D97A70;
  }
}
*,*::before,*::after{box-sizing:inherit}
html{-webkit-text-size-adjust:100%}
html,body{margin:0;height:100%;overflow-x:hidden}
body{
  background:var(--bg); color:var(--ink);
  font-family:"Hiragino Kaku Gothic ProN","Hiragino Sans","Noto Sans JP",system-ui,sans-serif;
  font-size:15px; line-height:1.6; letter-spacing:.01em;
  padding-top:var(--safe-t);
  -webkit-font-smoothing:antialiased;
  touch-action:manipulation;
}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:none;background:none;padding:0}
:focus-visible{outline:2px solid var(--indigo);outline-offset:2px}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

/* ---------- shell ---------- */
#app{max-width:620px;margin:0 auto;padding:0 16px calc(var(--nav-h) + var(--safe-b) + 28px)}
.view{display:none}
.view.on{display:block}

header.top{display:flex;align-items:baseline;justify-content:space-between;gap:12px;padding:20px 0 14px}
header.top h1{margin:0;font-size:20px;font-weight:700;letter-spacing:.02em}
header.top .sub{font-size:12.5px;color:var(--ink2);font-variant-numeric:tabular-nums}

/* ---------- bottom nav ---------- */
nav.tabs{
  position:fixed;left:0;right:0;bottom:0;z-index:40;
  display:flex;background:var(--surface);
  border-top:1px solid var(--line);
  padding-bottom:var(--safe-b);
}
nav.tabs button{
  flex:1;height:var(--nav-h);display:flex;flex-direction:column;
  align-items:center;justify-content:center;gap:4px;
  color:var(--ink3);font-size:11px;font-weight:600;
}
nav.tabs button svg{width:25px;height:25px;stroke:currentColor;fill:none;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
nav.tabs button[aria-current="page"]{color:var(--indigo)}
nav.tabs button .dot{position:absolute;margin-top:-30px;margin-left:18px;min-width:16px;height:16px;border-radius:8px;background:var(--amber);color:#fff;font-size:10px;line-height:16px;font-weight:700;padding:0 4px}
@media (prefers-color-scheme:dark){nav.tabs button .dot{color:#241C0B}}

/* ---------- cards & bits ---------- */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px}
.card + .card{margin-top:12px}
.muted{color:var(--ink2)}
.tiny{font-size:12.5px}
.num{font-variant-numeric:tabular-nums}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;
  padding:14px 20px;min-height:52px;border-radius:12px;font-size:16px;font-weight:700;
  background:var(--indigo);color:#fff;transition:opacity .12s}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .btn{color:#0E1A20}}
.btn:active{opacity:.75}
.btn.ghost{background:transparent;color:var(--indigo);border:1px solid var(--line)}
.btn.sub{background:var(--surface2);color:var(--ink);border:1px solid var(--line)}
.btn.wide{width:100%}
.btn.sm{padding:10px 15px;min-height:44px;font-size:14.5px;border-radius:10px}
.btn[disabled]{opacity:.4;pointer-events:none}

label.f{display:block;margin:18px 0 7px;font-size:13.5px;font-weight:700;color:var(--ink2)}
input[type=text],input[type=number],input[type=date],select,textarea{
  display:block;
  width:100%;max-width:100%;min-width:0;
  padding:14px 14px;border:1px solid var(--line);border-radius:11px;
  background:var(--surface2);font-size:16px;
  -webkit-appearance:none;appearance:none}
input[type=date]{min-height:44px;line-height:1.4}
input[type=number]::-webkit-inner-spin-button,
input[type=number]::-webkit-outer-spin-button{-webkit-appearance:none;margin:0}
textarea{resize:vertical;line-height:1.7}

.chips{display:flex;flex-wrap:wrap;gap:9px}
.chip{display:inline-flex;align-items:center;min-height:48px;
  padding:0 18px;border-radius:999px;border:1px solid var(--line);
  background:var(--surface2);font-size:15px;font-weight:600;color:var(--ink2)}
.chip[aria-pressed="true"]{background:var(--indigo);border-color:var(--indigo);color:#fff}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .chip[aria-pressed="true"]{color:#0E1A20}}
.chip .sw{display:inline-block;width:15px;height:15px;border-radius:4px;margin-right:8px;
  border:1px solid rgba(0,0,0,.18);flex:0 0 auto}

.catgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.catgrid button{padding:16px 6px;min-height:92px;border-radius:14px;border:1px solid var(--line);
  background:var(--surface2);font-size:13.5px;font-weight:700;color:var(--ink2);text-align:center;line-height:1.35}
.catgrid button .g{display:block;font-size:30px;margin-bottom:5px}
.catgrid button[aria-pressed="true"]{background:var(--indigo-bg);border-color:var(--indigo);
  color:var(--indigo-d);box-shadow:inset 0 0 0 1px var(--indigo)}

/* ---------- closet grid ---------- */
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:14px}
@media(min-width:480px){.grid{grid-template-columns:repeat(4,1fr)}}
.tile{position:relative;aspect-ratio:1;border-radius:var(--r-s);overflow:hidden;
  background:var(--surface2);border:1px solid var(--line);display:block}
.tile img{width:100%;height:100%;object-fit:cover;display:block;transition:filter .3s}
.tile .ph{width:100%;height:100%;display:flex;align-items:center;justify-content:center;font-size:26px;opacity:.35}
.tile .tag{position:absolute;left:6px;bottom:6px;padding:4px 8px;border-radius:7px;
  background:rgba(10,22,27,.78);color:#fff;font-size:11.5px;font-weight:700;letter-spacing:.02em}
.tile .flag{position:absolute;right:5px;top:5px;width:9px;height:9px;border-radius:5px;box-shadow:0 0 0 2px var(--surface)}
.tile .flag.amber{background:var(--amber)}
.tile .flag.ok{background:var(--ok)}

.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:11.5px;color:var(--ink3);margin-top:10px;align-items:center}
.legend i{display:inline-block;width:8px;height:8px;border-radius:4px;margin-right:5px;vertical-align:0}

.filters{display:flex;gap:7px;overflow-x:auto;padding:2px 0 8px;-webkit-overflow-scrolling:touch}
.filters::-webkit-scrollbar{display:none}
.filters .chip{flex:0 0 auto}

.empty{text-align:center;padding:44px 20px;color:var(--ink2)}
.empty .g{font-size:38px;display:block;margin-bottom:10px;opacity:.55}
.empty p{margin:0 0 16px;font-size:14px}

/* ---------- stats ---------- */
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:1px;background:var(--line2);
  border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.stats div{background:var(--surface);padding:14px 8px;text-align:center}
.stats b{display:block;font-size:21px;font-weight:700;font-variant-numeric:tabular-nums;letter-spacing:-.01em}
.stats span{font-size:11px;color:var(--ink2)}

/* ---------- list rows ---------- */
.row{display:flex;gap:13px;align-items:center;padding:13px 0;min-height:70px;border-top:1px solid var(--line2)}
.row:first-of-type{border-top:none}
.row .th{width:58px;height:58px;flex:0 0 58px;border-radius:8px;overflow:hidden;background:var(--surface2);
  display:flex;align-items:center;justify-content:center;font-size:20px;border:1px solid var(--line)}
.row .th img{width:100%;height:100%;object-fit:cover}
.row .body{flex:1;min-width:0}
.row .body b{display:block;font-size:15px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .body span{font-size:12px;color:var(--ink2)}

.note{border-radius:var(--r-s);padding:11px 13px;font-size:13px;line-height:1.65}
.note.amber{background:var(--amber-bg);color:var(--amber)}
.note.ok{background:var(--ok-bg);color:var(--ok)}
.note.indigo{background:var(--indigo-bg);color:var(--indigo-d)}

h2.sec{margin:26px 0 10px;font-size:15px;font-weight:700}
h2.sec .c{font-weight:500;color:var(--ink3);font-size:13px;margin-left:6px;font-variant-numeric:tabular-nums}

/* ---------- sheet ---------- */
.scrim{position:fixed;inset:0;background:rgba(8,18,22,.5);z-index:50;display:none}
.scrim.on{display:block}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:51;background:var(--bg);
  border-radius:18px 18px 0 0;max-height:92vh;overflow-y:auto;overflow-x:hidden;display:none;
  overscroll-behavior:contain;
  padding:0 16px calc(var(--safe-b) + 24px);-webkit-overflow-scrolling:touch}
.sheet.on{display:block}
.sheet .handle{width:38px;height:4px;border-radius:2px;background:var(--line);margin:9px auto 4px}
.sheet .shead{display:flex;align-items:center;justify-content:space-between;
  position:sticky;top:0;background:var(--bg);padding:8px 0 12px;z-index:2}
.sheet .shead h3{margin:0;font-size:17px;font-weight:700}
.sheet .x{font-size:16px;color:var(--indigo);padding:12px 6px 12px 18px;font-weight:700;min-height:48px}
.sheet .inner{max-width:588px;margin:0 auto}

.hero{width:100%;aspect-ratio:1;object-fit:cover;border-radius:var(--r);border:1px solid var(--line);background:var(--surface2);display:block}
.kv{display:grid;grid-template-columns:auto 1fr;gap:7px 16px;font-size:13.5px;margin:14px 0}
.kv dt{color:var(--ink2)}
.kv dd{margin:0;font-weight:600;font-variant-numeric:tabular-nums}

.shot{width:100%;aspect-ratio:1;border-radius:18px;border:2px dashed var(--indigo);
  background:var(--indigo-bg);display:flex;flex-direction:column;align-items:center;
  justify-content:center;gap:12px;color:var(--indigo-d);font-size:17px;font-weight:700}
.shot .g{font-size:58px;line-height:1}
.shot img{width:100%;height:100%;object-fit:cover;border-radius:12px}
.shot.has{border-style:solid;border-color:var(--line);padding:0;overflow:hidden;background:var(--surface2)}

.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(var(--nav-h) + var(--safe-b) + 16px);
  background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:999px;font-size:13.5px;
  font-weight:600;z-index:80;opacity:0;pointer-events:none;transition:opacity .2s}
.toast.on{opacity:1}
.sp{height:8px}
.cam{position:fixed;inset:0;z-index:70;background:#0B1418;display:none;
  flex-direction:column;align-items:center;justify-content:center;gap:18px;
  padding:calc(var(--safe-t) + 16px) 16px calc(var(--safe-b) + 20px)}
.cam.on{display:flex}
.cam-stage{position:relative;width:100%;max-width:520px;aspect-ratio:1;
  border-radius:18px;overflow:hidden;background:#000}
.cam-stage video{width:100%;height:100%;object-fit:cover;display:block}
.cam-guide{position:absolute;inset:4%;pointer-events:none}
.cam-guide i{position:absolute;width:30px;height:30px;border:3px solid rgba(255,255,255,.92)}
.cam-guide i:nth-child(1){top:0;left:0;border-right:none;border-bottom:none;border-radius:8px 0 0 0}
.cam-guide i:nth-child(2){top:0;right:0;border-left:none;border-bottom:none;border-radius:0 8px 0 0}
.cam-guide i:nth-child(3){bottom:0;left:0;border-right:none;border-top:none;border-radius:0 0 0 8px}
.cam-guide i:nth-child(4){bottom:0;right:0;border-left:none;border-top:none;border-radius:0 0 8px 0}
.cam-tip{margin:0;color:rgba(255,255,255,.82);font-size:13.5px;text-align:center;line-height:1.7}
.cam-bar{display:flex;align-items:center;justify-content:space-between;width:100%;max-width:520px}
.cam-side{color:#fff;font-size:15px;font-weight:700;padding:14px 10px;min-width:88px;min-height:52px}
.cam-shot{width:78px;height:78px;border-radius:50%;background:rgba(255,255,255,.22);
  display:flex;align-items:center;justify-content:center}
.cam-shot span{width:62px;height:62px;border-radius:50%;background:#fff;display:block}
.cam-shot:active span{transform:scale(.9)}
.stickybar{position:sticky;bottom:calc(var(--nav-h) + var(--safe-b) + 10px);z-index:20;
  display:flex;gap:9px;margin-top:16px;padding:11px;border-radius:16px;
  background:var(--surface);border:1px solid var(--line);
  box-shadow:0 8px 24px rgba(8,20,26,.14)}
.stickybar .btn{flex:1;min-width:0;padding-left:8px;padding-right:8px;font-size:15px}
.fc-head{display:flex;flex-direction:column;gap:2px;padding-bottom:10px;border-bottom:1px solid var(--line2);margin-bottom:6px}
.fc-head b{font-size:15px;font-weight:700}
.fc-head span{font-size:11.5px;color:var(--ink2);font-variant-numeric:tabular-nums}
.fc-row{display:flex;align-items:baseline;gap:10px;padding:7px 0}
.fc-row b{font-size:15px;font-weight:700;min-width:58px}
.fc-row span{font-size:12.5px;color:var(--ink2);flex:1}
.fc-row em{font-style:normal;font-size:12.5px;font-weight:700}
.fc-row em.amber{color:var(--amber)}
.fc-row em.indigo{color:var(--ink2);font-weight:500}
.airow{display:flex;align-items:center;gap:12px;margin-top:12px}
.airow .btn{flex:0 0 auto}
.row .th.av{color:#fff;font-size:20px;font-weight:700;border:none;line-height:1}
.chip .mdot{display:inline-block;width:11px;height:11px;border-radius:6px;margin-right:8px;flex:0 0 auto}
.chip[aria-pressed="true"] .mdot{background:#fff!important}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .chip[aria-pressed="true"] .mdot{background:#0E1A20!important}}
.hist{display:flex;align-items:center;gap:10px;padding:8px 0;border-top:1px solid var(--line2);font-size:13px}
.hist b{font-variant-numeric:tabular-nums;min-width:66px}
.hist span{flex:1;color:var(--ink2);font-size:12px}
.hist button{color:var(--danger);font-size:12px;font-weight:600;padding:4px 8px}
.hr{height:1px;background:var(--line);margin:18px 0}
.act{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}
.act .btn{flex:1;min-width:140px}
</style>
</head>
<body>

<div id="app">

  <!-- ===== 今日 ===== -->
  <section class="view on" id="v-today">
    <header class="top"><h1>今日</h1><span class="sub" id="today-date"></span></header>
    <div class="stats" id="today-stats"></div>
    <div class="sp"></div>
    <div id="today-body"></div>
  </section>

  <!-- ===== クローゼット ===== -->
  <section class="view" id="v-closet">
    <header class="top"><h1>クローゼット</h1><span class="sub" id="closet-count"></span></header>
    <div class="filters" id="f-member"></div>
    <div class="filters" id="f-cat"></div>
    <div id="closet-body"></div>
  </section>

  <!-- ===== 登録 ===== -->
  <section class="view" id="v-add">
    <header class="top"><h1>登録</h1><span class="sub" id="add-streak"></span></header>
    <div id="add-body"></div>
  </section>

  <!-- ===== 手放す ===== -->
  <section class="view" id="v-out">
    <header class="top"><h1>手放す</h1><span class="sub" id="out-count"></span></header>
    <div id="out-body"></div>
  </section>

  <!-- ===== 設定 ===== -->
  <section class="view" id="v-set">
    <header class="top"><h1>設定</h1><span class="sub">v0.4</span></header>
    <div id="set-body"></div>
  </section>

</div>

<nav class="tabs" id="tabs"></nav>
<div class="scrim" id="scrim"></div>
<div class="sheet" id="sheet"><div class="handle"></div><div class="inner" id="sheet-inner"></div></div>
<div class="cam" id="cam">
  <div class="cam-stage">
    <video id="cam-video" playsinline muted autoplay></video>
    <div class="cam-guide"><i></i><i></i><i></i><i></i></div>
  </div>
  <p class="cam-tip">平らな場所に広げて、枠いっぱいに入れてください。<br>手でしわを伸ばすときれいに写ります。</p>
  <div class="cam-bar">
    <button class="cam-side" id="cam-close">閉じる</button>
    <button class="cam-shot" id="cam-shoot" aria-label="撮影"><span></span></button>
    <button class="cam-side" id="cam-pick">写真から</button>
  </div>
</div>
<div class="toast" id="toast"></div>

<script>
"use strict";

/* ============================================================
   定数
   ============================================================ */
const CATS = [
  {id:'tops',   n:'トップス', g:'👕'},
  {id:'bottoms',n:'ボトムス', g:'👖'},
  {id:'outer',  n:'アウター', g:'🧥'},
  {id:'dress',  n:'ワンピ',   g:'👗'},
  {id:'shoes',  n:'くつ',     g:'👟'},
  {id:'under',  n:'インナー', g:'🩲'},
  {id:'goods',  n:'こもの',   g:'🧣'},
  {id:'other',  n:'その他',   g:'🧺'}
];
const COLORS = [
  {n:'ホワイト', hex:'#FFFFFF'}, {n:'ブラック', hex:'#1A1A1A'},
  {n:'グレー',   hex:'#8A9295'}, {n:'ネイビー', hex:'#22324F'},
  {n:'ブルー',   hex:'#3C6FB0'}, {n:'サックス', hex:'#9EC4DE'},
  {n:'グリーン', hex:'#3F7A4F'}, {n:'カーキ', hex:'#7A7550'},
  {n:'イエロー', hex:'#E0B93C'}, {n:'オレンジ', hex:'#D97B37'},
  {n:'レッド',   hex:'#B93A38'}, {n:'ピンク',   hex:'#DFA0AE'},
  {n:'パープル', hex:'#7A5C96'}, {n:'ブラウン', hex:'#7A5340'},
  {n:'ベージュ', hex:'#D6C3A5'}, {n:'柄物',     hex:'#B9AFA2'}
];
const SEASONS = ['春','夏','秋','冬'];
const MEMBER_COLORS = [
  {n:'ブルー',  hex:'#3F79B8'}, {n:'グリーン',hex:'#3E8C63'},
  {n:'オレンジ',hex:'#D2762F'}, {n:'ピンク',  hex:'#C96A8B'},
  {n:'パープル',hex:'#7A62A8'}, {n:'イエロー',hex:'#C08A1C'},
  {n:'レッド',  hex:'#B84B42'}, {n:'グレー',  hex:'#6B7B82'}
];
const memberHex = m => (MEMBER_COLORS.find(c=>c.n===m?.color)||MEMBER_COLORS[7]).hex;
const KID_SIZES = [80,90,100,110,120,130,140,150,160];
const ADULT_SIZES = ['XS','S','M','L','XL','XXL','F'];
const STALE_DAYS = 120;      // これ以上着ていなければ「眠っている服」
const MERCARI_MIN = 300;
const SIZE_MARGIN = 5;       // 「110サイズ」は身長115cmくらいまで着られる、という目安
/* 年齢別の年間身長増加量（cm/年）の目安。実測が2回以上あればそちらを優先する */
const GROWTH_BY_AGE = [
  [0,25],[1,12],[2,8],[3,7],[4,6.5],[5,6.5],[6,6],[7,6],[8,6],
  [9,6],[10,6.5],[11,7],[12,6.5],[13,5],[14,3],[15,1.5],[16,0.8],[17,0.4],[18,0]
];

/* ============================================================
   IndexedDB
   ============================================================ */
const DB_NAME='kazoku-closet', DB_VER=2;
let db=null;

function openDB(){
  return new Promise((res,rej)=>{
    const r=indexedDB.open(DB_NAME,DB_VER);
    r.onupgradeneeded=e=>{
      const d=e.target.result;
      if(!d.objectStoreNames.contains('members')) d.createObjectStore('members',{keyPath:'id'});
      if(!d.objectStoreNames.contains('items')){
        const s=d.createObjectStore('items',{keyPath:'id'});
        s.createIndex('memberId','memberId',{unique:false});
      }
      if(!d.objectStoreNames.contains('wears')){
        const s=d.createObjectStore('wears',{keyPath:'id'});
        s.createIndex('itemId','itemId',{unique:false});
      }
      if(!d.objectStoreNames.contains('photos')) d.createObjectStore('photos',{keyPath:'id'});
      if(!d.objectStoreNames.contains('growth')){
        const s=d.createObjectStore('growth',{keyPath:'id'});
        s.createIndex('memberId','memberId',{unique:false});
      }
    };
    r.onsuccess=()=>{db=r.result;res(db)};

function dbAll(store){return new Promise((res,rej)=>{const r=db.transaction(store,'readonly').objectStore(store).getAll();r.onsuccess=()=>res(r.result||[]);r.onerror=()=>rej(r.error)})}
function dbGet(store,id){return new Promise((res,rej)=>{const r=db.transaction(store,'readonly').objectStore(store).get(id);r.onsuccess=()=>res(r.result||null);r.onerror=()=>rej(r.error)})}
function dbKeys(store){return new Promise((res,rej)=>{const r=db.transaction(store,'readonly').objectStore(store).getAllKeys();r.onsuccess=()=>res(r.result||[]);r.onerror=()=>rej(r.error)})}

/* v0.3より前は写真IDを服に書き忘れていた。IDに含まれる時刻で突き合わせて復旧する */
async function repairPhotoLinks(){
  const orphans=S.items.filter(i=>!i.photoId);
  if(!orphans.length) return 0;
  const used=new Set(S.items.map(i=>i.photoId).filter(Boolean));
  const free=(await dbKeys('photos'))
    .filter(k=>!used.has(k))
    .map(k=>({id:k,t:parseInt(String(k).slice(0,8),36)}))
    .filter(p=>Number.isFinite(p.t));
  if(!free.length) return 0;
  let fixed=0;
  for(const it of orphans){
    const t=parseInt(String(it.id).slice(0,8),36);
    if(!Number.isFinite(t)) continue;
    let best=null,bd=Infinity;
    for(const p of free){ const gap=Math.abs(p.t-t); if(gap<bd){bd=gap;best=p} }
    if(best&&bd<=2000){
      it.photoId=best.id;
      await dbPut('items',it);
      free.splice(free.indexOf(best),1);
      fixed++;
    }
  }
  if(fixed) await reload();
  return fixed;
}

   画像処理：リサイズ + 代表色の推定
   ============================================================ */
async function loadBitmap(file){

    try{ return await createImageBitmap(file) }catch(e){}
  }
  return new Promise((res,rej)=>{
    const fr=new FileReader();

const OUT_SIZE = 900;          // 仕上がりの一辺
const SUBJECT_FILL = 0.84;     // 服が枠に占める割合。これで大きさが揃う

/* 被写体の範囲を求める。背景と色が違う画素の広がりを見る */
function subjectBox(cx,w,h,bg){
  const d=cx.getImageData(0,0,w,h).data;
  const col=new Int32Array(w), row=new Int32Array(h);
  const TH=62;
  for(let y=0;y<h;y+=2){
    for(let x=0;x<w;x+=2){
      const i=(y*w+x)*4;
      if(Math.abs(d[i]-bg[0])+Math.abs(d[i+1]-bg[1])+Math.abs(d[i+2]-bg[2])>TH){ col[x]++; row[y]++ }
    }
  }
  const colTh=Math.max(3,Math.round(h*0.012)), rowTh=Math.max(3,Math.round(w*0.012));
  let minX=w,maxX=-1,minY=h,maxY=-1;
  for(let x=0;x<w;x++) if(col[x]>colTh){ if(x<minX)minX=x; if(x>maxX)maxX=x }
  for(let y=0;y<h;y++) if(row[y]>rowTh){ if(y<minY)minY=y; if(y>maxY)maxY=y }
  if(maxX<0||maxY<0) return null;
  const bw=maxX-minX, bh=maxY-minY;
  const ratio=(bw*bh)/(w*h);
  if(ratio<0.03||ratio>0.985) return null;   // 検出できなかったとみなす
  return {minX,minY,bw,bh};
}

/* 背景を白に寄せ、服を中央に同じ大きさで切り出す */
function normalize(work,wcx,w,h){
  const bg=sampleEdge(wcx,w,h)||[235,235,235];
  const box=subjectBox(wcx,w,h,bg);
  let sx,sy,ss;
  if(box){
    ss=Math.max(box.bw,box.bh)/SUBJECT_FILL;
    sx=box.minX+box.bw/2-ss/2;
    sy=box.minY+box.bh/2-ss/2;
  }else{
    ss=Math.min(w,h); sx=(w-ss)/2; sy=(h-ss)/2;
  }
  const out=document.createElement('canvas');
  out.width=OUT_SIZE; out.height=OUT_SIZE;
  const ocx=out.getContext('2d',{willReadFrequently:true});
  ocx.fillStyle='#ffffff'; ocx.fillRect(0,0,OUT_SIZE,OUT_SIZE);
  ocx.drawImage(work,sx,sy,ss,ss,0,0,OUT_SIZE,OUT_SIZE);

  // 背景が明るいときだけ、そこを白の基準にして色かぶりと露出を補正する
  const lum=0.299*bg[0]+0.587*bg[1]+0.114*bg[2];
  if(lum>85){
    const t=246;
    const gain=[t/Math.max(1,bg[0]),t/Math.max(1,bg[1]),t/Math.max(1,bg[2])]
      .map(g=>Math.max(0.75,Math.min(1.9,g)));
    const im=ocx.getImageData(0,0,OUT_SIZE,OUT_SIZE), od=im.data;
    for(let i=0;i<od.length;i+=4){
      od[i]  =Math.min(255,od[i]  *gain[0]);
      od[i+1]=Math.min(255,od[i+1]*gain[1]);
      od[i+2]=Math.min(255,od[i+2]*gain[2]);
    }
    ocx.putImageData(im,0,0);
  }
  return out;
}

/* 正規化しない場合：中央を正方形に切るだけ */
function plainSquare(work,w,h){
  const s=Math.min(w,h);
  const out=document.createElement('canvas');
  out.width=OUT_SIZE; out.height=OUT_SIZE;
  const ocx=out.getContext('2d');
  ocx.fillStyle='#ffffff'; ocx.fillRect(0,0,OUT_SIZE,OUT_SIZE);
  ocx.drawImage(work,(w-s)/2,(h-s)/2,s,s,0,0,OUT_SIZE,OUT_SIZE);
  return out;
}

/* File でも Canvas でも受け取り、正規化した JPEG と推定色を返す */
async function processPhoto(source){
  const isCanvas = source instanceof HTMLCanvasElement;
  const src = isCanvas ? source : await loadBitmap(source);
  const sw=src.width||src.naturalWidth, sh=src.height||src.naturalHeight;
  const sc=Math.min(1,1200/Math.max(sw,sh));
  const w=Math.round(sw*sc), h=Math.round(sh*sc);
  const work=document.createElement('canvas'); work.width=w; work.height=h;
  const wcx=work.getContext('2d',{willReadFrequently:true});
  wcx.drawImage(src,0,0,w,h);

  const color=guessColor(wcx,w,h);
  const out=S.settings.normalize ? normalize(work,wcx,w,h) : plainSquare(work,w,h);
  const blob=await new Promise(r=>out.toBlob(r,'image/jpeg',0.78));
  if(!isCanvas && src.close) src.close();
  return {blob,color};
}
/* 外周から背景色を推定する（床・ベッド・テーブルなど） */
function sampleEdge(cx,w,h){
  const ew=Math.max(1,Math.round(w*0.07)), eh=Math.max(1,Math.round(h*0.07));
  const strips=[cx.getImageData(0,0,w,eh).data, cx.getImageData(0,h-eh,w,eh).data,
                cx.getImageData(0,0,ew,h).data, cx.getImageData(w-ew,0,ew,h).data];
  let r=0,g=0,b=0,n=0;
  for(const d of strips) for(let i=0;i<d.length;i+=40){ r+=d[i];g+=d[i+1];b+=d[i+2];n++ }
  return n?[r/n,g/n,b/n]:null;
}
/* 中央部の最頻色。bg を渡すとそれに近い画素を無視する */
function tallyCenter(cx,w,h,bg){
  const x0=Math.round(w*0.22), y0=Math.round(h*0.22);
  const cw=Math.max(1,Math.round(w*0.56)), ch=Math.max(1,Math.round(h*0.56));
  const d=cx.getImageData(x0,y0,cw,ch).data;
  const buckets=new Map();
  let kept=0;
  for(let i=0;i<d.length;i+=16){
    const r=d[i],g=d[i+1],b=d[i+2];
    if(bg && Math.abs(r-bg[0])+Math.abs(g-bg[1])+Math.abs(b-bg[2])<54) continue;
    const k=(r>>4)*256+(g>>4)*16+(b>>4);
    const e=buckets.get(k)||[0,0,0,0];
    e[0]+=r;e[1]+=g;e[2]+=b;e[3]++; buckets.set(k,e); kept++;
  }
  if(kept<60) return null;
  let best=null,bc=0;
  for(const e of buckets.values()){ if(e[3]>bc){bc=e[3];best=e} }
  if(!best) return null;
  return [best[0]/best[3], best[1]/best[3], best[2]/best[3]];
}
function nearestColorName(rgb){
  const [r,g,b]=rgb;
  let nearest=null,nd=1e9;
  for(const c of COLORS){
    if(c.n==='柄物') continue;
    const cr=parseInt(c.hex.slice(1,3),16), cg=parseInt(c.hex.slice(3,5),16), cb=parseInt(c.hex.slice(5,7),16);
    const dist=(r-cr)**2*0.3+(g-cg)**2*0.59+(b-cb)**2*0.11;
    if(dist<nd){nd=dist;nearest=c.n}
  }
  return nearest;
}
function guessColor(cx,w,h){
  try{
    const bg=sampleEdge(cx,w,h);
    // まず背景を除いて集計。服が画面いっぱいで何も残らなければ除外なしで再集計
    const rgb=tallyCenter(cx,w,h,bg)||tallyCenter(cx,w,h,null);
    return rgb?nearestColorName(rgb):null;
  }catch(e){ return null }
}

/* ============================================================
   判定ロジック
   ============================================================ */
/* ---- 身長と成長のモデル ---------------------------------- */

/* そのメンバーの身長記録（古い順） */
function heightsOf(mid){
  return S.growth.filter(g=>g.memberId===mid).sort((a,b)=>a.date.localeCompare(b.date));
}
/* 年齢から平均的な年間成長量を引く */
function avgGrowth(age){
  if(age===null||age===undefined) return null;
  let r=GROWTH_BY_AGE[0][1];
  for(const [a,v] of GROWTH_BY_AGE){ if(age>=a) r=v }
  return r;
}
/* 現在の推定身長と成長ペース。記録がなければ null */
function growthInfo(m){
  if(!m) return null;
  const hs=heightsOf(m.id);
  if(!hs.length) return null;
  const last=hs[hs.length-1];
  let rate=null, source='平均';
  if(hs.length>=2){
    const first=hs[0];
    const days=(new Date(last.date+'T00:00:00')-new Date(first.date+'T00:00:00'))/86400000;
    if(days>=60){
      const r=(last.height-first.height)/days*365;
      if(r>0.3&&r<30){ rate=r; source='実測' }
    }
  }
  if(rate===null) rate=avgGrowth(ageOf(m));
  if(rate===null) return null;
  const elapsedY=Math.max(0,(daysSince(last.date)||0)/365);
  const nowH=last.height+rate*elapsedY;
  return {measured:last.height, measuredAt:last.date, nowH, rate, source, count:hs.length};
}
/* 身長 → 今ちょうど良いサイズ（10cm刻み） */
function fitSize(h){ return Math.min(160,Math.max(80,Math.round(h/10)*10)) }
/* そのサイズがあと何ヶ月着られるか。すでに越えていれば負の値 */
function monthsLeft(m,size){
  const g=growthInfo(m); if(!g) return null;
  const s=Number(size); if(!Number.isFinite(s)) return null;
  if(g.rate<=0) return 999;
  return (s+SIZE_MARGIN-g.nowH)/g.rate*12;
}
function monthsLabel(mo){
  if(mo===null) return null;
  if(mo<=0)  return 'サイズアウト';
  if(mo<1)   return 'あと1ヶ月未満';
  if(mo>=24) return 'まだ余裕あり';
  return 'あと約'+Math.round(mo)+'ヶ月';
}

/* ---- 判定 ------------------------------------------------ */
function isActive(it){ return (it.status||'active')==='active' }

/* サイズアウト：身長記録があれば身長で、なければ登録サイズで判定 */
function isOutgrown(it){
  if(!isActive(it)) return false;
  const m=memberOf(it.memberId); if(!m) return false;
  const s=sizeNum(it.size); if(s===null) return false;
  const g=growthInfo(m);
  if(g) return (s+SIZE_MARGIN) < g.nowH;
  const cur=sizeNum(m.currentSize);
  return cur!==null && s<cur;
}
/* 眠っている服 */
function isStale(it){
  if(!isActive(it)) return false;
  if(isOutgrown(it)) return false;
  const d=daysSince(it.lastWorn||it.addedAt);
  return d!==null && d>=STALE_DAYS;
}
/* 今のその人のサイズ（身長優先） */
function currentSizeOf(m){
  const g=growthInfo(m);
  if(g) return fitSize(g.nowH);
  return sizeNum(m?.currentSize);
}
/* おさがり：サイズアウト品を、今それが合う別メンバーへ */
function handDownTarget(it){
  const s=sizeNum(it.size); if(s===null) return null;
  for(const m of S.members){
    if(m.id===it.memberId) continue;
    const cur=currentSizeOf(m);
    if(cur===null) continue;
    if(s>=cur && s<=cur+10) return m;     // 今ぴったり〜1サイズ上まで
  }
  return null;
}
/* サイズ別の残り期間。持っている服をサイズごとにまとめて、近い順に返す */
function outgrowForecast(m){
  const g=growthInfo(m); if(!g) return null;
  const age=ageOf(m); if(age!==null&&age>15) return null;
  const bySize=new Map();
  for(const i of S.items){
    if(i.memberId!==m.id||!isActive(i)) continue;
    const s=sizeNum(i.size); if(s===null) continue;
    bySize.set(s,(bySize.get(s)||0)+1);
  }
  const rows=[...bySize.entries()]
    .map(([size,count])=>({size,count,months:monthsLeft(m,size)}))
    .filter(r=>r.months!==null&&r.months<18)
    .sort((a,b)=>a.months-b.months);
  return {g,age,rows};
}
/* メルカリ想定価格（目安） */
function estPrice(it){
  const p=Number(it.price);
  if(!Number.isFinite(p)||p<=0) return null;
  const y=it.purchaseDate?Math.max(0,daysSince(it.purchaseDate)/365):1;
  const yf=Math.max(0.28,1-y*0.22);
  const wf=Math.max(0.55,1-(it.wearCount||0)*0.018);
  const v=Math.round(p*0.42*yf*wf/100)*100;
  return Math.max(MERCARI_MIN,v);
}
function listingText(it){
  const m=memberOf(it.memberId), c=catOf(it.category);
  const brand=it.brand?it.brand:'';
  const kid=(ageOf(m)??99)<=14;
  const title=[brand,kid?'キッズ':'',c.n,it.size||'',it.color||''].filter(Boolean).join(' ');

}

  h+=`<div class="filters" id="today-mem"></div><div class="grid" id="today-grid"></div>`;

  // サイズアウト予測
  const kids=S.members.filter(m=>{const a=ageOf(m); return a!==null&&a<=15});
  const noHeight=kids.filter(m=>!heightsOf(m.id).length);
  const fc=kids.map(m=>({m,f:outgrowForecast(m)})).filter(x=>x.f&&x.f.rows.length);

  if(fc.length){
    h+=`<h2 class="sec">サイズアウト予測</h2>`;
    h+=fc.map(({m,f})=>{
      const g=f.g;
      const rows=f.rows.map(r=>{
        const lab=monthsLabel(r.months);
        const cls=r.months<=0?'amber':r.months<=3?'amber':'indigo';
        return `<div class="fc-row"><b class="num">${r.size}cm</b>
          <span class="num">${r.count}着</span>
          <em class="${cls}">${lab}</em></div>`;
      }).join('');
      return `<div class="card" style="margin-bottom:10px">
        <div class="fc-head"><b>${esc(m.name)}</b>
          <span>${f.age}歳・推定 ${g.nowH.toFixed(0)}cm・年 ${g.rate.toFixed(1)}cm（${g.source}）</span></div>
        ${rows}
        <div class="tiny muted" style="margin-top:10px">今ちょうど良いのは ${fitSize(g.nowH)}cm です。${g.source==='平均'?'身長を2回以上記録すると、この子の実際のペースで計算します。':''}</div>
      </div>`;
    }).join('');

  if(noHeight.length){
    h+=`<h2 class="sec">身長を記録すると予測できます</h2>`;
    h+=noHeight.map(m=>`<button class="note amber" data-member="${m.id}" style="display:block;width:100%;text-align:left;margin-bottom:8px">${esc(m.name)}さんの身長がまだ未記録です。タップして入力すると、持っている服があと何ヶ月着られるか出ます。</button>`).join('');
  }
  $('#today-body').innerHTML=h;

  // メンバーフィルタ（今日の記録用）
  if(!S._todayMem) S._todayMem=S.members[0].id;
  $('#today-mem').innerHTML=S.members.map(m=>
    `<button class="chip" data-tmem="${m.id}" aria-pressed="${S._todayMem===m.id}"><span class="mdot" style="background:${memberHex(m)}"></span>${esc(m.name)}</button>`).join('');

}
async function drawTodayGrid(){
  const g=$('#today-grid'); if(!g) return;
  const list=S.items.filter(i=>isActive(i)&&i.memberId===S._todayMem)
    .sort((a,b)=>(b.lastWorn||'').localeCompare(a.lastWorn||''))
    .slice(0,24);
  if(!list.length){ g.innerHTML=`<div class="tiny muted" style="grid-column:1/-1">この人の服はまだありません。</div>`; return }
  g.innerHTML=list.map(it=>{
    const worn=S.wears.some(w=>w.itemId===it.id&&w.date===today());
    return `<button class="tile" data-wear="${it.id}">
      <div class="ph" data-photo="${it.photoId||''}">${catOf(it.category).g}</div>
      ${worn?'<span class="flag ok"></span>':''}
      <span class="tag">${worn?'着た':esc(it.size||catOf(it.category).n)}</span>
    </button>`}).join('');
  hydratePhotos(g);
}

async function hydratePhotos(root){
  if(!root) return;
  for(const el of root.querySelectorAll('[data-photo]')){
    const pid=el.getAttribute('data-photo');
    if(!pid) continue;
    const u=await photoURL(pid);
    if(u){ const st=el.getAttribute('style')||''; el.outerHTML=`<img src="${u}" alt="" style="${st}">` }
  }
}

async function wearItem(id){
  const it=S.items.find(i=>i.id===id); if(!it) return;
  const t=today();
  const exist=S.wears.find(w=>w.itemId===id&&w.date===t);
  if(exist){
    await dbDel('wears',exist.id);
    it.wearCount=Math.max(0,(it.wearCount||0)-1);
    const rest=S.wears.filter(w=>w.itemId===id&&w.id!==exist.id).map(w=>w.date).sort();
    it.lastWorn=rest.length?rest[rest.length-1]:null;
    await dbPut('items',it);
    toast('記録を取り消しました');
  }else{
    await dbPut('wears',{id:uid(),itemId:id,date:t});
    it.wearCount=(it.wearCount||0)+1;
    it.lastWorn=t;
    await dbPut('items',it);
    toast('今日着た服に記録しました');
  }
  await reload(); render();
}

async function saveDraft(keepGoing){
  syncAdd();
  const d=S.draft||{};
  const mid=d.memberId??S.lastUsed.memberId??S.members[0]?.id;
  if(!mid){ toast('家族を先に登録してください'); return }
  if(!d.category){ toast('カテゴリを選んでください'); return }

  let photoId=null;
  if(d.blob){ photoId=uid(); await dbPut('photos',{id:photoId,blob:d.blob}) }

  const it={
    id:uid(), memberId:mid, category:d.category, photoId,
    size:String(d.size??memberOf(mid)?.currentSize??''),
    color:d.color||null, brand:(d.brand||'').trim()||null,
    price:d.price?Number(d.price):null,
    purchaseDate:d.purchaseDate||null,
    season:d.season||[], status:'active',
    pattern:d.pattern||null, hasCharacterPrint:!!d.hasCharacterPrint,
    wearCount:0, lastWorn:null, addedAt:today()
  };
  await dbPut('items',it);
  S.lastUsed={memberId:mid,category:d.category};
  if(d.photoURL) URL.revokeObjectURL(d.photoURL);
  S.draft = keepGoing ? {memberId:mid,category:d.category,size:d.size,season:d.season} : null;
  await reload();
  toast('保存しました');
  if(keepGoing){ renderAdd(); window.scrollTo(0,0) }
  else go('closet');
}

async function exportData(withPhotos){
  const data={version:2,exportedAt:new Date().toISOString(),
    members:S.members,items:S.items,wears:S.wears,growth:S.growth,photos:[]};
  if(withPhotos){
    const ps=await dbAll('photos');
    for(const p of ps){
      const b64=await new Promise(r=>{const fr=new FileReader();fr.onload=()=>r(fr.result);fr.readAsDataURL(p.blob)});
      data.photos.push({id:p.id,dataURL:b64});
    }
  }
  const blob=new Blob([JSON.stringify(data)],{type:'application/json'});
  const a=document.createElement('a');
  a.href=URL.createObjectURL(blob);
  a.download=`closet-${today()}${withPhotos?'-full':''}.json`;
  a.click();
  setTimeout(()=>URL.revokeObjectURL(a.href),4000);
  toast(withPhotos?'写真ごと書き出しました':'データを書き出しました');
}
async function importData(file){
  try{
    const txt=await file.text();
    const d=JSON.parse(txt);
    if(!d||!Array.isArray(d.items)) throw new Error('形式が違います');
    for(const m of (d.members||[])) await dbPut('members',m);
    for(const i of d.items) await dbPut('items',i);
    for(const w of (d.wears||[])) await dbPut('wears',w);
    for(const gr of (d.growth||[])) await dbPut('growth',gr);
    for(const p of (d.photos||[])){
      const res=await fetch(p.dataURL); const blob=await res.blob();
      await dbPut('photos',{id:p.id,blob});
    }
    urlCache.clear();
    await reload(); render();
    toast('読み込みました');
  }catch(e){ toast('読み込めませんでした') }
}

/* 解析用に小さく作り直す。900pxのまま送ると画像トークンが3倍かかる */
async function analysisDataURL(blob){
  const bmp=await loadBitmap(blob);
  const s=512;
  const cv=document.createElement('canvas'); cv.width=s; cv.height=s;
  cv.getContext('2d').drawImage(bmp,0,0,s,s);
  if(bmp.close) bmp.close();
  return cv.toDataURL('image/jpeg',0.8);
}

function applyAnalysis(r){
  const d=S.draft||{};
  const patch={aiDone:true};
  if(r.category && CATS.some(c=>c.id===r.category)) patch.category=r.category;
  if(r.color && COLORS.some(c=>c.n===r.color)){ patch.color=r.color; patch.autoColor=true }
  if(Array.isArray(r.season)){
    const ss=r.season.filter(s=>SEASONS.includes(s));
    if(ss.length) patch.season=ss;
  }
  patch.pattern = r.pattern || null;
  patch.hasCharacterPrint = !!r.hasCharacterPrint;
  patch.aiConfidence = typeof r.confidence==='number' ? r.confidence : null;
  S.draft={...d,...patch};
}

async function aiAnalyze(){
  const d=S.draft;
  if(!d?.blob){ toast('先に写真を撮ってください'); return }

  const base=(S.settings.apiBase||'').trim().replace(/\/+$/,'');
  if(!base){ toast('設定でAPIのURLを入れてください'); go('set'); return }

  if(aiRemaining()<=0){
    toast('今月のAI判別を使い切りました');
    S.draft={...d,aiError:'limit'}; renderAdd(); return;
  }

  S.draft={...d,aiBusy:true,aiError:null}; renderAdd();
  try{
    const image=await analysisDataURL(d.blob);
    const res=await fetch(base+'/analyze',{
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body:JSON.stringify({image})
    });
    const json=await res.json().catch(()=>null);
    if(!res.ok||!json?.ok) throw new Error(json?.error||('HTTP '+res.status));

    // 成功したときだけ回数を消費する
    const u=usageNow(); u.count++; saveUsage();

    S.draft={...S.draft,aiBusy:false};
    applyAnalysis(json.result);
    renderAdd();
    toast('AIが判別しました');
  }catch(err){
    S.draft={...S.draft,aiBusy:false,aiError:String(err.message||err)};
    renderAdd();
    toast('判別できませんでした');
  }
}

let camStream=null;

async function openCamera(){
  if(!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia){ $('#shot').click(); return }
  try{
    camStream=await navigator.mediaDevices.getUserMedia({
      video:{facingMode:{ideal:'environment'},width:{ideal:1600},height:{ideal:1600}},
      audio:false});
  }catch(e){
    toast('カメラを使えないので写真から選びます');
    $('#shot').click(); return;
  }
  const v=$('#cam-video');
  v.srcObject=camStream;
  $('#cam').classList.add('on');
  try{ await v.play() }catch(e){}
}
function closeCamera(){
  if(camStream){ camStream.getTracks().forEach(t=>t.stop()); camStream=null }
  const v=$('#cam-video'); if(v) v.srcObject=null;
  $('#cam').classList.remove('on');
}
async function shootCamera(){
  const v=$('#cam-video');
  const vw=v.videoWidth, vh=v.videoHeight;
  if(!vw||!vh){ toast('もう一度お試しください'); return }
  const s=Math.round(Math.min(vw,vh)*0.92);          // ガイド枠にあたる中央の正方形
  const cv=document.createElement('canvas'); cv.width=s; cv.height=s;
  cv.getContext('2d').drawImage(v,(vw-s)/2,(vh-s)/2,s,s,0,0,s,s);
  closeCamera();
  await acceptPhoto(cv);
}
/* 撮影でもファイル選択でも、ここを通す */
async function acceptPhoto(source){
  const lab=$('#shot-label');
  if(lab) lab.innerHTML='<span class="g">⏳</span><span>仕上げています…</span>';
  try{
    const {blob,color}=await processPhoto(source);
    if(S.draft?.photoURL) URL.revokeObjectURL(S.draft.photoURL);
    S.draft={...(S.draft||{}),blob,photoURL:URL.createObjectURL(blob),
      color:S.draft?.autoColor===false?S.draft.color:(color||S.draft?.color),
      autoColor:S.draft?.autoColor===false?false:!!color,
      aiDone:false,aiError:null,pattern:null,hasCharacterPrint:false};
  }catch(err){ toast('写真を読み込めませんでした') }
  if(S.view!=='add') go('add'); else renderAdd();
  if(S.settings.aiMode==='auto' && S.draft?.blob && S.settings.apiBase) aiAnalyze();
}
document.addEventListener('click',async e=>{

  if(g('data-tab')) return go(g('data-tab'));
  if(g('data-go'))  return go(g('data-go'));

  if(g('data-fc')){ S.fCat=g('data-fc');   return renderCloset() }
  if(g('data-tmem')){ S._todayMem=g('data-tmem'); return renderToday() }

  if(g('data-wear'))  return wearItem(g('data-wear'));
  if(g('data-wear2')){ await wearItem(g('data-wear2')); return closeSheet() }
  if(g('data-item'))  return openItem(g('data-item'));
  if(g('data-member'))return openMemberForm(g('data-member'));
  if(t.id==='add-member') return openMemberForm(null);

  /* --- 登録フォーム --- */
  if(g('data-dmem')){ syncAdd(); S.draft={...(S.draft||{}),memberId:g('data-dmem'),size:undefined}; return renderAdd() }
  if(g('data-dcat')){ syncAdd(); S.draft={...(S.draft||{}),category:g('data-dcat')}; return renderAdd() }
  if(g('data-dsize')){ syncAdd(); S.draft={...(S.draft||{}),size:g('data-dsize')}; return renderAdd() }
  if(g('data-dcolor')){ syncAdd(); S.draft={...(S.draft||{}),color:g('data-dcolor'),autoColor:false}; return renderAdd() }
  if(g('data-dseason')){
    syncAdd();

    cur.has(s)?cur.delete(s):cur.add(s);
    S.draft={...(S.draft||{}),season:[...cur]}; return renderAdd();
  }
  if(t.id==='shot-label'||t.id==='shot-redo') return openCamera();
  if(t.id==='shot-pick'||t.id==='cam-pick'){ closeCamera(); return $('#shot').click() }
  if(t.id==='cam-close') return closeCamera();
  if(t.id==='cam-shoot') return shootCamera();
  if(t.id==='ai-run') return aiAnalyze();
  if(g('data-aimode')){
    S.settings.aiMode=g('data-aimode'); saveSettings(); renderSet(); return;
  }
  if(t.id==='toggle-plan'){
    S.settings.plan = aiUnlimited() ? 'free' : 'unlimited';
    saveSettings(); renderSet(); return;
  }
  if(t.id==='save-api'){
    const v=($('#api-base').value||'').trim().replace(/\/+$/,'');
    S.settings.apiBase=v; saveSettings();
    if(!v){ toast('URLを消しました'); return renderSet() }
    try{
      const r=await fetch(v+'/health');
      const j=await r.json();
      toast(j?.ok?'接続できました':'応答が想定と違います');
    }catch(e){ toast('つながりませんでした') }
    renderSet(); return;
  }
  if(t.id==='toggle-norm'){
    S.settings.normalize=!S.settings.normalize; saveSettings(); renderSet();
    toast(S.settings.normalize?'きれいに整えます':'撮ったままを使います');
    return;
  }

      b.setAttribute('aria-pressed', b.getAttribute('data-mcolor')===S._mcolor));
    return;

  if(g('data-savemember')!==null&&t.hasAttribute('data-savemember')){

    if(!name){ toast('名前を入れてください'); return }
    const exist=memberOf(id);

      currentSize:S._msize||exist?.currentSize||null,
      color:S._mcolor||exist?.color||MEMBER_COLORS[S.members.length%MEMBER_COLORS.length].n,
      order:exist?.order??S.members.length});
    const hv=parseFloat($('#m-height')?.value);
    const hd=$('#m-hdate')?.value||today();
    if(Number.isFinite(hv)&&hv>=40&&hv<=210){
      const dup=S.growth.find(x=>x.memberId===id&&x.date===hd);
      if(dup) await dbDel('growth',dup.id);
      await dbPut('growth',{id:uid(),memberId:id,date:hd,height:Math.round(hv*10)/10});
    }
    await reload(); closeSheet(); render(); toast('保存しました');
    return;
  }
  if(g('data-delheight')){
    await dbDel('growth',g('data-delheight'));

    await dbDel('members',g('data-delmember'));
    await reload(); closeSheet(); render(); toast('削除しました');
    return;
  }

  /* --- 編集フォーム --- */
  if(g('data-emem')||g('data-ecat')||g('data-esize')||g('data-ecolor')||g('data-eseason')){
    const grp=g('data-emem')?'e-mem':g('data-ecat')?'e-cat':g('data-esize')?'e-size':g('data-ecolor')?'e-color':'e-season';

      t.setAttribute('aria-pressed',cur.has(v));

      const key={'e-mem':'memberId','e-cat':'category','e-size':'size','e-color':'color'}[grp];
      const attr={'e-mem':'data-emem','e-cat':'data-ecat','e-size':'data-esize','e-color':'data-ecolor'}[grp];
      S._edit[key]=t.getAttribute(attr);
      $('#'+grp).querySelectorAll('['+attr+']').forEach(b=>
        b.setAttribute('aria-pressed', b.getAttribute(attr)===S._edit[key]));
    }
    return;
  }
  if(g('data-saveedit')){
    const it=S.items.find(i=>i.id===g('data-saveedit')); if(!it) return;
    Object.assign(it,{
      memberId:S._edit.memberId, category:S._edit.category,
      size:S._edit.size, color:S._edit.color, season:S._edit.season,
      brand:($('#e-brand').value||'').trim()||null,
      price:$('#e-price').value?Number($('#e-price').value):null,
      purchaseDate:$('#e-pdate').value||null
    });
    await dbPut('items',it); await reload(); closeSheet(); render(); toast('保存しました');
    return;
  }

  /* --- 詳細アクション --- */
  if(g('data-listing')) return openListing(g('data-listing'));
  if(g('data-edit'))    return openEdit(g('data-edit'));

    const ta=$('#lt');

    catch(err){ ta.select(); document.execCommand('copy'); toast('コピーしました') }

  if(g('data-handdown')){
    const it=S.items.find(i=>i.id===g('data-handdown')); const to=handDownTarget(it);
    if(!it||!to) return;
    it.memberId=to.id; it.handedDown=true;
    await dbPut('items',it); await reload(); closeSheet(); render();
    toast(to.name+'さんへ移しました');
    return;
  }
  if(g('data-status')){
    const [id,st]=g('data-status').split('|');
    const it=S.items.find(i=>i.id===id); if(!it) return;
    it.status=st; await dbPut('items',it); await reload(); closeSheet(); render();
    toast(st==='sold'?'売却済みにしました':st==='listed'?'出品中にしました':'戻しました');
    return;
  }
  if(g('data-del')){
    if(!confirm('この服を削除します。よろしいですか？')) return;
    const it=S.items.find(i=>i.id===g('data-del'));
    if(it?.photoId) await dbDel('photos',it.photoId);
    await dbDel('items',g('data-del'));
    await reload(); closeSheet(); render(); toast('削除しました');
    return;
  }

  /* --- 設定 --- */
  if(t.id==='exp-meta') return exportData(false);
  if(t.id==='exp-full') return exportData(true);
  if(t.id==='imp')      return $('#impfile').click();
});

$('#scrim').addEventListener('click',closeSheet);

document.addEventListener('change',async e=>{
  if(e.target.id==='shot'){
    const f=e.target.files?.[0];
    e.target.value='';
    if(f) await acceptPhoto(f);
    return;
  }
  if(e.target.id==='impfile'){
    const f=e.target.files?.[0]; if(f) await importData(f);
    e.target.value='';
  }
});

/* ============================================================
   起動
   ============================================================ */
(async function init(){
  try{
    await openDB();
    await reload();
    const fixed=await repairPhotoLinks();
    go('today');
    if(fixed) setTimeout(()=>toast(fixed+'着の写真を復旧しました'),600);
  }catch(e){
    document.getElementById('app').innerHTML=
      '<div class="empty"><span class="g">⚠️</span><p>データベースを開けませんでした。<br>プライベートブラウズを解除して、もう一度開いてください。</p></div>';
  }
})();
</script>
